<!DOCTYPE html><html lang="ar" dir="rtl"><head><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f4c75"><link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مصروف البيت</title><style>:root{--bg:#f7f8fb;--card:#fff;--text:#0f172a;--muted:#64748b;--primary:#0f4c75;--primary2:#3282b8;--green:#10b981;--red:#ef4444;--border:#e2e8f0;--shadow:0 8px 24px rgba(15,23,42,.06)}.dark{--bg:#0b1220;--card:#111c2e;--text:#e2e8f0;--muted:#94a3b8;--primary:#38bdf8;--primary2:#0ea5e9;--border:#1e293b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma;background:var(--bg);color:var(--text)}header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:800;font-size:20px}.monthSel{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--border);padding:6px 10px;border-radius:12px}.monthSel input{background:transparent;border:0;color:var(--text);font-weight:700;width:130px}.main{padding:14px 12px 90px;max-width:520px;margin:auto}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.stat{text-align:center;padding:10px;border-radius:14px}.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:var(--muted)}.progress{position:relative;width:110px;height:110px;margin:auto}.progress svg{transform:rotate(-90deg)}.badge{padding:4px 8px;border-radius:99px;font-size:11px;background:var(--bg);border:1px solid var(--border)}.btn{border:0;border-radius:14px;padding:12px 14px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;width:100%}.btn-ghost{background:var(--bg);border:1px solid var(--border);color:var(--text)}.input{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);outline:0}label{font-size:12px;color:var(--muted);margin:8px 0 4px;display:block;font-weight:700}.row{display:flex;gap:8px}.categories{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cat{padding:12px;border-radius:14px;background:var(--bg);border:1px solid var(--border);display:flex;gap:8px;align-items:center;cursor:pointer}.cat.active{border-color:var(--primary);background:rgba(14,165,233,.12)}.listItem{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}.listItem:last-child{border:0}.bottomNav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 4px;z-index:30;max-width:520px;margin:auto}.navBtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:12px;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer}.navBtn.active{color:var(--primary);background:var(--bg)}.fab{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:0;width:56px;height:56px;border-radius:18px;font-size:28px;box-shadow:0 10px 20px rgba(0,0,0,.2);z-index:29}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:40}.modal.open{display:flex}.sheet{background:var(--card);width:100%;max-width:520px;margin:auto;border-radius:22px 22px 0 0;padding:16px;max-height:92vh;overflow:auto}.chip{padding:6px 10px;border-radius:99px;border:1px solid var(--border);background:var(--bg);font-size:12px;cursor:pointer}.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}canvas{width:100%;height:180px}.alert{padding:10px;border-radius:12px;font-size:13px;font-weight:700}.alert-warn{background:rgba(245,158,11,.15);color:#d97706;border:1px solid rgba(245,158,11,.3)}.alert-danger{background:rgba(239,68,68,.12);color:#dc2626;border:1px solid rgba(239,68,68,.3)}.langBtn{border:0;background:#eef2ff;color:#4338ca;padding:7px 12px;border-radius:20px;font-weight:700;cursor:pointer;font-size:12px}</style></head><body><header><div class="logo"><span>🏠</span><span id="appNameTitle">مصروف البيت</span></div><div style="display:flex;gap:8px;align-items:center"><div class="monthSel">📅 <input type="month" id="monthInput"></div><button class="langBtn" onclick="toggleLang()" id="langBtn">English</button></div></header><div class="main" id="appMain"></div><button class="fab" onclick="openAdd()">+</button><div class="bottomNav"><button class="navBtn active" onclick="nav('home')" id="n-home">🏠<span id="n-home-t">الرئيسية</span></button><button class="navBtn" onclick="nav('log')" id="n-log">📋<span id="n-log-t">السجل</span></button><button class="navBtn" onclick="nav('orders')" id="n-orders">🛒<span id="n-orders-t">الطلبيات</span></button><button class="navBtn" onclick="nav('reports')" id="n-reports">📊<span id="n-reports-t">التقارير</span></button><button class="navBtn" onclick="nav('settings')" id="n-settings">⚙️<span id="n-settings-t">الإعدادات</span></button></div><div class="modal" id="addModal" onclick="if(event.target==this)closeAdd()"><div class="sheet"><h3 style="margin:0 0 10px" id="addTitle">إضافة مصروف</h3><label id="l_cat">القسم</label><div id="catPicker" class="categories" style="max-height:180px;overflow:auto"></div><label id="l_amount">المبلغ (د.أ)</label><input id="f_amount" type="number" inputmode="decimal" class="input" placeholder="مثال: 15.50"><label id="l_desc">الوصف</label><input id="f_desc" class="input" placeholder="مثال: خضار، فاتورة..."><label id="l_date">التاريخ</label><input id="f_date" type="date" class="input"><label id="l_note">ملاحظة</label><input id="f_note" class="input" placeholder="ملاحظة..."><div style="height:10px"></div><div class="row"><button class="btn btn-ghost" onclick="closeAdd()" style="flex:1" id="btn_cancel">إلغاء</button><button class="btn btn-primary" style="flex:2" onclick="saveExpense()" id="btn_save">حفظ 💾</button></div></div></div><div class="modal" id="catModal" onclick="if(event.target==this)closeCat()"><div class="sheet"><h3 id="catManageTitle">إدارة الأقسام</h3><div id="catManageList"></div><div style="height:10px"></div><label id="l_newcat">إضافة قسم جديد</label><div class="row"><input id="newCatName" class="input" placeholder="مثال: هدايا"><input id="newCatIcon" class="input" style="max-width:80px" placeholder="🎁"><button class="btn btn-primary" onclick="addNewCat()">+</button></div><div style="height:10px"></div><button class="btn btn-ghost" style="width:100%" onclick="closeCat()" id="btn_close">إغلاق</button></div></div><div class="modal" id="orderModal" onclick="if(event.target==this)closeOrder()"><div class="sheet"><h3 id="orderTitle">إضافة طلبية</h3><label id="l_pname">اسم المنتج</label><input id="o_name" class="input"><label id="l_qty">الكمية</label><input id="o_qty" type="number" class="input" value="1"><label id="l_price">السعر المتوقع</label><input id="o_price" type="number" class="input"><label id="l_priority">الأولوية</label><div class="row" style="margin:6px 0"><button class="chip active" data-p="عالية" onclick="setP(this)" id="p_high">🔴 عالية</button><button class="chip" data-p="متوسطة" onclick="setP(this)" id="p_med">🟡 متوسطة</button><button class="chip" data-p="منخفضة" onclick="setP(this)" id="p_low">🟢 منخفضة</button></div><button class="btn btn-primary" onclick="saveOrder()" id="btn_save_order">حفظ الطلبية</button></div></div><script>let db=JSON.parse(localStorage.getItem('masroof_v3')||'null')||{budgets:{},expenses:[],orders:[],cats:[{id:'super',name:'السوبر ماركت',nameEn:'Supermarket',icon:'🛒'},{id:'rent',name:'إيجار البيت',nameEn:'Rent',icon:'🏠'},{id:'car',name:'قسط السيارة',nameEn:'Car Payment',icon:'🚗'},{id:'tel',name:'فواتير الاتصالات',nameEn:'Telecom',icon:'📱'},{id:'elec',name:'الكهرباء',nameEn:'Electricity',icon:'💡'},{id:'water',name:'الماء',nameEn:'Water',icon:'💧'},{id:'net',name:'الإنترنت',nameEn:'Internet',icon:'🌐'},{id:'fuel',name:'البنزين',nameEn:'Fuel',icon:'⛽'},{id:'pharm',name:'الصيدلية',nameEn:'Pharmacy',icon:'💊'},{id:'school',name:'المدرسة',nameEn:'School',icon:'🎒'},{id:'rest',name:'المطاعم',nameEn:'Restaurants',icon:'🍔'},{id:'other',name:'مشتريات أخرى',nameEn:'Other',icon:'🛍️'}],settings:{appName:'مصروف البيت',appNameEn:'Home Expenses',lang:localStorage.getItem('lang')||'ar',currency:'د.أ',currencyEn:'JOD',theme:'light',social:{fb:'',insta:'',tiktok:'',other:''}}};db.cats=db.cats.map(c=>{if(!c.nameEn){const map={super:'Supermarket',rent:'Rent',car:'Car Payment',tel:'Telecom',elec:'Electricity',water:'Water',net:'Internet',fuel:'Fuel',pharm:'Pharmacy',school:'School',rest:'Restaurants',other:'Other'};c.nameEn=map[c.id]||c.name}return c});let curMonth=new Date().toISOString().slice(0,7);let curPage='home';let selectedCat=null;let selectedPriority='عالية';let editId=null;let filterCat='all',searchQ='';const T={ar:{app:'مصروف البيت',enBtn:'English',budget:'الميزانية',spent:'مصروف',remain:'الباقي',editBud:'تعديل الميزانية',fromBud:'من الميزانية',mostSpent:'🔥 أكثر الأقسام صرفًا',latest:'📋 آخر المصروفات',viewAll:'عرض الكل',quickAdd:'+ إضافة مصروف سريع',noData:'لا يوجد',search:'🔍 بحث...',all:'الكل',logTitle:'سجل مصروفات',home:'الرئيسية',log:'السجل',orders:'الطلبيات',reports:'التقارير',settings:'الإعدادات',total:'الإجمالي',pending:'غير مشتراة',done:'تم',addOrder:'+ طلبية',ordersTitle:'طلبيات',noOrders:'لا يوجد طلبيات',howMuch:'📊 قديش صرفت هذا الشهر؟',ops:'عمليات',byCats:'حسب الأقسام:',byDays:'📅 حسب الأيام',compare:'📈 مقارنة الأشهر',settingsTitle:'⚙️ الإعدادات',appName:'✏️ اسم التطبيق',lang:'🌐 اللغة',currency:'💱 العملة',theme:'🌙 الوضع',light:'☀️ نهاري',dark:'🌙 ليلي',shareApp:'📲 مشاركة التطبيق',copyLink:'🔗 نسخ الرابط',whatsapp:'💬 واتساب',share:'📤 مشاركة عامة',social:'🌐 روابط التواصل',data:'💾 البيانات',export:'📥 تصدير نسخة',import:'📤 استيراد',deleteAll:'🗑️ حذف كل البيانات',manageCats:'📂 إدارة الأقسام',openCats:'فتح إدارة الأقسام',addExpense:'إضافة مصروف',cat:'القسم',amount:'المبلغ (د.أ)',desc:'الوصف',date:'التاريخ',note:'ملاحظة',cancel:'إلغاء',save:'حفظ 💾',catManage:'إدارة الأقسام',newCat:'إضافة قسم جديد',close:'إغلاق',orderAdd:'إضافة طلبية',pname:'اسم المنتج',qty:'الكمية',expPrice:'السعر المتوقع',priority:'الأولوية',high:'🔴 عالية',med:'🟡 متوسطة',low:'🟢 منخفضة',saveOrder:'حفظ الطلبية',overBud:'⚠️ تجاوزت الميزانية! صرفت',from:'من',nearBud:'⏰ اقتربت من الميزانية',howMuchQ:'قديش صرفت هذا الشهر؟'},en:{app:'Home Expenses',enBtn:'العربية',budget:'Budget',spent:'Spent',remain:'Remaining',editBud:'Edit Budget',fromBud:'of Budget',mostSpent:'🔥 Top Spending',latest:'📋 Recent Expenses',viewAll:'View All',quickAdd:'+ Quick Add Expense',noData:'No data',search:'🔍 Search...',all:'All',logTitle:'Expenses Log',home:'Home',log:'Log',orders:'Orders',reports:'Reports',settings:'Settings',total:'Total',pending:'Pending',done:'Done',addOrder:'+ Order',ordersTitle:'Orders',noOrders:'No orders',howMuch:'📊 How much spent?',ops:'Operations',byCats:'By Categories:',byDays:'📅 By Days',compare:'📈 Months Comparison',settingsTitle:'⚙️ Settings',appName:'✏️ App Name',lang:'🌐 Language',currency:'💱 Currency',theme:'🌙 Theme',light:'☀️ Light',dark:'🌙 Dark',shareApp:'📲 Share App',copyLink:'🔗 Copy Link',whatsapp:'💬 WhatsApp',share:'📤 Share',social:'🌐 Social Links',data:'💾 Data',export:'📥 Export',import:'📤 Import',deleteAll:'🗑️ Delete All',manageCats:'📂 Categories',openCats:'Manage Categories',addExpense:'Add Expense',cat:'Category',amount:'Amount (JOD)',desc:'Description',date:'Date',note:'Note',cancel:'Cancel',save:'Save 💾',catManage:'Manage Categories',newCat:'Add New Category',close:'Close',orderAdd:'Add Order',pname:'Product Name',qty:'Quantity',expPrice:'Expected Price',priority:'Priority',high:'🔴 High',med:'🟡 Medium',low:'🟢 Low',saveOrder:'Save Order',overBud:'⚠️ Over budget! Spent',from:'from',nearBud:'⏰ Near budget',howMuchQ:'How much did you spend?'}};function L(k){return T[db.settings.lang][k]||k}function CN(c){return db.settings.lang==='ar'?c.name:c.nameEn}function CF(n){return (Number(n)||0).toFixed(2)+' '+(db.settings.lang==='ar'?db.settings.currency:db.settings.currencyEn)}function save(){localStorage.setItem('masroof_v3',JSON.stringify(db));localStorage.setItem('lang',db.settings.lang)}function monthLabel(m){const d=new Date(m+'-01');return d.toLocaleDateString(db.settings.lang==='ar'?'ar-EG':'en-US',{month:'long',year:'numeric'});}function toggleLang(){db.settings.lang=db.settings.lang==='ar'?'en':'ar';save();applySettings();render();}function applySettings(){document.getElementById('appNameTitle').textContent=db.settings.lang==='ar'?db.settings.appName:db.settings.appNameEn;document.documentElement.lang=db.settings.lang;document.documentElement.dir=db.settings.lang==='ar'?'rtl':'ltr';document.body.classList.toggle('dark',db.settings.theme==='dark');document.getElementById('langBtn').textContent=L('enBtn');}function init(){document.getElementById('monthInput').value=curMonth;document.getElementById('monthInput').addEventListener('change',e=>{curMonth=e.target.value;render();});applySettings();nav('home');}function nav(p){curPage=p;document.querySelectorAll('.navBtn').forEach(b=>b.classList.remove('active'));document.getElementById('n-'+p).classList.add('active');render();}function getMonthData(m){const ex=db.expenses.filter(e=>e.month===m);const total=ex.reduce((s,e)=>s+e.amount,0);const budget=db.budgets[m]||0;return{ex,total,budget,remaining:budget-total};}function render(){const main=document.getElementById('appMain');if(curPage==='home')main.innerHTML=renderHome();if(curPage==='log')main.innerHTML=renderLog();if(curPage==='orders')main.innerHTML=renderOrders();if(curPage==='reports')main.innerHTML=renderReports();if(curPage==='settings')main.innerHTML=renderSettings();if(curPage==='reports')setTimeout(drawChart,200);updateNav();}function updateNav(){['home','log','orders','reports','settings'].forEach(k=>{const el=document.getElementById('n-'+k+'-t');if(el) el.textContent=L(k)});}function renderHome(){const{ex,total,budget,remaining}=getMonthData(curMonth);const percent=budget>0?Math.min(100,Math.round(total/budget*100)):0;const byCat={};ex.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.amount);const top=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,4);let warn='';if(budget>0){if(total>budget)warn=`<div class="alert alert-danger">${L('overBud')} ${CF(total)} ${L('from')} ${CF(budget)}</div>`;else if(total/budget>0.8)warn=`<div class="alert alert-warn">${L('nearBud')} - ${percent}%</div>`;}return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>${L('budget')} ${monthLabel(curMonth)}</b><button class="badge" onclick="editBudget()">✏️ ${L('editBud')}</button></div><div class="grid3"><div class="stat" style="background:rgba(16,185,129,.12)"><span>${L('budget')}</span><b style="color:var(--green)">${CF(budget)}</b></div><div class="stat" style="background:rgba(239,68,68,.1)"><span>${L('spent')}</span><b style="color:var(--red)">${CF(total)}</b></div><div class="stat" style="background:rgba(14,165,233,.12)"><span>${L('remain')}</span><b style="color:${remaining<0?'var(--red)':'var(--primary)'}">${CF(remaining)}</b></div></div><div style="display:flex;gap:12px;align-items:center;margin-top:14px;justify-content:center"><div class="progress"><svg width="110" height="110"><circle cx="55" cy="55" r="48" stroke="var(--border)" stroke-width="10" fill="none"/><circle cx="55" cy="55" r="48" stroke="${remaining<0?'#ef4444':'#0f4c75'}" stroke-width="10" fill="none" stroke-dasharray="${2*Math.PI*48}" stroke-dashoffset="${2*Math.PI*48*(1-percent/100)}" stroke-linecap="round"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><b style="font-size:22px">${percent}%</b><span style="font-size:11px;color:var(--muted)">${L('fromBud')}</span></div></div><div style="flex:1">${warn||`<div style="font-size:13px;color:var(--muted)">${L('howMuchQ')}<br><b style="font-size:18px;color:var(--text)">${CF(total)}</b><br>${ex.length} ${L('ops')}</div>`}</div></div></div><div class="card"><b>${L('mostSpent')}</b><div style="margin-top:8px">${top.length?top.map(([id,amt])=>{const c=db.cats.find(x=>x.id===id);return `<div class="row" style="justify-content:space-between;margin:6px 0"><span>${c?c.icon:''} ${c?CN(c):id}</span><b>${CF(amt)}</b></div>`}).join(''):`<span style="color:var(--muted)">${L('noData')}</span>`}</div></div><div class="card"><div style="display:flex;justify-content:space-between"><b>${L('latest')}</b><button class="badge" onclick="nav('log')">${L('viewAll')}</button></div>${ex.slice(-5).reverse().map(e=>{const c=db.cats.find(x=>x.id===e.cat);return `<div class="listItem"><div><b>${c?c.icon:''} ${e.desc}</b><div style="font-size:11px;color:var(--muted)">${c?CN(c):''} • ${e.date}</div></div><b style="color:var(--red)">-${CF(e.amount)}</b></div>`}).join('')||`<div style="color:var(--muted);text-align:center;padding:12px">${L('noData')}</div>`}</div><button class="btn btn-primary" onclick="openAdd()" style="margin-top:6px">${L('quickAdd')}</button>`;}function renderLog(){const{ex}=getMonthData(curMonth);let f=ex.filter(e=>{const ok=filterCat==='all'||e.cat===filterCat;const okS=!searchQ||e.desc.includes(searchQ)||(e.note&&e.note.includes(searchQ));return ok&&okS;}).sort((a,b)=>new Date(b.date)-new Date(a.date));return `<div class="card"><b>${L('logTitle')} ${monthLabel(curMonth)}</b><div style="height:8px"></div><input class="input" placeholder="${L('search')}" value="${searchQ}" oninput="searchQ=this.value;render()"><div style="height:8px"></div><div style="display:flex;gap:6px;overflow:auto;padding-bottom:4px"><button class="chip ${filterCat==='all'?'active':''}" onclick="filterCat='all';render()">${L('all')}</button>${db.cats.map(c=>`<button class="chip ${filterCat===c.id?'active':''}" onclick="filterCat='${c.id}';render()">${c.icon} ${CN(c)}</button>`).join('')}</div><div style="margin-top:8px">${f.map(e=>{const c=db.cats.find(x=>x.id===e.cat);return `<div class="listItem"><div><b>${c?c.icon:''} ${e.desc}</b><div style="font-size:11px;color:var(--muted)">${c?CN(c):''} • ${e.date}${e.note?' • '+e.note:''}</div></div><div style="text-align:left"><b>${CF(e.amount)}</b><div><button class="badge" onclick="editExpense('${e.id}')">✏️</button> <button class="badge" onclick="delExpense('${e.id}')">🗑️</button></div></div></div>`}).join('')||`<div style="text-align:center;color:var(--muted);padding:16px">${L('noData')}</div>`}</div></div>`;}function renderOrders(){const orders=db.orders.filter(o=>o.month===curMonth);const total=orders.reduce((s,o)=>s+o.qty*o.price,0);const pending=orders.filter(o=>!o.done).reduce((s,o)=>s+o.qty*o.price,0);return `<div class="card"><div style="display:flex;justify-content:space-between"><b>🛒 ${L('ordersTitle')} ${monthLabel(curMonth)}</b><button class="btn btn-primary" style="width:auto;padding:8px 12px" onclick="openOrder()">${L('addOrder')}</button></div><div class="grid3" style="margin-top:10px"><div class="stat" style="background:var(--bg)"><span>${L('total')}</span><b>${CF(total)}</b></div><div class="stat" style="background:rgba(245,158,11,.12)"><span>${L('pending')}</span><b>${CF(pending)}</b></div><div class="stat" style="background:rgba(16,185,129,.12)"><span>${L('done')}</span><b>${orders.filter(o=>o.done).length}/${orders.length}</b></div></div></div><div class="card">${orders.map(o=>`<div class="listItem"><div style="display:flex;gap:8px;align-items:center"><input type="checkbox" ${o.done?'checked':''} onchange="toggleOrder('${o.id}')" style="width:18px;height:18px"><div><b style="${o.done?'text-decoration:line-through;color:var(--muted)':''}">${o.name} ×${o.qty}</b><div style="font-size:11px;color:var(--muted)">${o.priority} • ${CF(o.price)} = ${CF(o.qty*o.price)}</div></div></div><div><button class="badge" onclick="delOrder('${o.id}')">🗑️</button></div></div>`).join('')||`<div style="text-align:center;color:var(--muted);padding:12px">${L('noOrders')}</div>`}</div>`;}function renderReports(){const{ex,total,budget,remaining}=getMonthData(curMonth);const byCat={};ex.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.amount);const byDay={};ex.forEach(e=>{byDay[e.date]=(byDay[e.date]||0)+e.amount;});const months=Object.keys(db.budgets).concat([...new Set(db.expenses.map(e=>e.month))]).filter((v,i,a)=>a.indexOf(v)===i).sort().slice(-6);return `<div class="card"><b>${L('howMuch')}</b><div class="grid3" style="margin-top:10px"><div class="stat" style="background:var(--bg)"><span>${L('total')}</span><b>${CF(total)}</b></div><div class="stat" style="background:var(--bg)"><span>${L('ops')}</span><b>${ex.length}</b></div><div class="stat" style="background:var(--bg)"><span>${L('remain')}</span><b>${CF(remaining)}</b></div></div><canvas id="chart"></canvas><div style="margin-top:8px"><b style="font-size:13px">${L('byCats')}</b>${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([id,amt])=>{const c=db.cats.find(x=>x.id===id);const p=total?Math.round(amt/total*100):0;return `<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${c?c.icon:''} ${c?CN(c):id}</span><span>${CF(amt)} (${p}%)</span></div><div style="height:6px;background:var(--bg);border-radius:99px;overflow:hidden"><div style="width:${p}%;height:100%;background:var(--primary)"></div></div></div>`}).join('')||`<div style="color:var(--muted)">${L('noData')}</div>`}</div></div><div class="card"><b>${L('byDays')}</b>${Object.entries(byDay).sort().map(([d,a])=>`<div class="row" style="justify-content:space-between;margin:6px 0"><span>${d}</span><b>${CF(a)}</b></div>`).join('')||`<div style="color:var(--muted)">${L('noData')}</div>`}</div><div class="card"><b>${L('compare')}</b>${months.map(m=>{const d=getMonthData(m);const p=d.budget?Math.round(d.total/d.budget*100):0;return `<div class="row" style="justify-content:space-between;margin:6px 0"><span>${monthLabel(m)}</span><span>${CF(d.total)} / ${CF(d.budget)} (${p}%)</span></div>`}).join('')}</div>`;}function renderSettings(){const s=db.settings;return `<div class="card"><b>${L('settingsTitle')}</b><label>${L('appName')}</label><input class="input" value="${db.settings.lang==='ar'?s.appName:s.appNameEn}" oninput="if(db.settings.lang==='ar')db.settings.appName=this.value;else db.settings.appNameEn=this.value;save();applySettings()"><label>${L('lang')}</label><div class="row"><button class="chip ${s.lang==='ar'?'active':''}" onclick="db.settings.lang='ar';save();applySettings();render()">عربي</button><button class="chip ${s.lang==='en'?'active':''}" onclick="db.settings.lang='en';save();applySettings();render()">English</button></div><label>${L('currency')}</label><input class="input" value="${s.lang==='ar'?s.currency:s.currencyEn}" oninput="if(db.settings.lang==='ar')db.settings.currency=this.value;else db.settings.currencyEn=this.value;save();render()"><label>${L('theme')}</label><div class="row"><button class="chip ${s.theme==='light'?'active':''}" onclick="db.settings.theme='light';save();applySettings();render()">${L('light')}</button><button class="chip ${s.theme==='dark'?'active':''}" onclick="db.settings.theme='dark';save();applySettings();render()">${L('dark')}</button></div></div><div class="card"><b>${L('shareApp')}</b><div class="row" style="margin-top:8px"><button class="btn btn-ghost" style="flex:1" onclick="copyLink()">${L('copyLink')}</button><button class="btn btn-ghost" style="flex:1" onclick="shareWhats()">${L('whatsapp')}</button></div><button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="shareNative()">${L('share')}</button></div><div class="card"><b>${L('data')}</b><div class="row" style="margin-top:8px"><button class="btn btn-ghost" style="flex:1" onclick="exportData()">${L('export')}</button><label class="btn btn-ghost" style="flex:1;cursor:pointer">${L('import')}<input type="file" hidden onchange="importData(event)"></label></div><button class="btn" style="width:100%;margin-top:8px;background:rgba(239,68,68,.1);color:#dc2626;border:1px solid rgba(239,68,68,.2)" onclick="clearData()">${L('deleteAll')}</button></div><div class="card"><b>${L('manageCats')}</b><button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="openCat()">${L('openCats')}</button></div>`;}function openAdd(){editId=null;selectedCat=db.cats[0].id;document.getElementById('f_date').value=new Date().toISOString().slice(0,10);document.getElementById('f_amount').value='';document.getElementById('f_desc').value='';document.getElementById('f_note').value='';renderCatPicker();document.getElementById('addModal').classList.add('open');updateAddLang();}function closeAdd(){document.getElementById('addModal').classList.remove('open');}function updateAddLang(){document.getElementById('addTitle').textContent=L('addExpense');document.getElementById('l_cat').textContent=L('cat');document.getElementById('l_amount').textContent=L('amount');document.getElementById('l_desc').textContent=L('desc');document.getElementById('l_date').textContent=L('date');document.getElementById('l_note').textContent=L('note');document.getElementById('btn_cancel').textContent=L('cancel');document.getElementById('btn_save').textContent=L('save');}function renderCatPicker(){document.getElementById('catPicker').innerHTML=db.cats.map(c=>`<div class="cat ${selectedCat===c.id?'active':''}" onclick="selectedCat='${c.id}';renderCatPicker()">${c.icon} ${CN(c)}</div>`).join('');}function saveExpense(){const amt=parseFloat(document.getElementById('f_amount').value);if(!amt)return alert('amount');const desc=document.getElementById('f_desc').value||'';const date=document.getElementById('f_date').value||new Date().toISOString().slice(0,10);const note=document.getElementById('f_note').value;const month=date.slice(0,7);if(editId){const e=db.expenses.find(x=>x.id===editId);e.cat=selectedCat;e.amount=amt;e.desc=desc;e.date=date;e.note=note;e.month=month;}else db.expenses.push({id:Date.now()+'',month,cat:selectedCat,amount:amt,desc,date,note});save();closeAdd();render();}function editExpense(id){const e=db.expenses.find(x=>x.id===id);editId=id;selectedCat=e.cat;document.getElementById('f_amount').value=e.amount;document.getElementById('f_desc').value=e.desc;document.getElementById('f_date').value=e.date;document.getElementById('f_note').value=e.note||'';renderCatPicker();document.getElementById('addModal').classList.add('open');updateAddLang();}function delExpense(id){if(confirm('Delete? / حذف؟')){db.expenses=db.expenses.filter(x=>x.id!==id);save();render();}}function editBudget(){const cur=db.budgets[curMonth]||0;const v=prompt(L('budget')+' '+monthLabel(curMonth),cur);if(v!==null){db.budgets[curMonth]=parseFloat(v)||0;save();render();}}function openCat(){document.getElementById('catModal').classList.add('open');renderCatManage();}function closeCat(){document.getElementById('catModal').classList.remove('open');}function renderCatManage(){document.getElementById('catManageList').innerHTML=db.cats.map(c=>`<div class="listItem"><span>${c.icon} ${CN(c)}</span><button class="badge" onclick="removeCat('${c.id}')">🗑️</button></div>`).join('');}function addNewCat(){const n=document.getElementById('newCatName').value.trim();const ic=document.getElementById('newCatIcon').value.trim()||'📦';if(!n)return;db.cats.push({id:Date.now()+'',name:n,nameEn:n,icon:ic});save();document.getElementById('newCatName').value='';renderCatManage();render();}function removeCat(id){if(confirm('Delete?')){db.cats=db.cats.filter(c=>c.id!==id);save();renderCatManage();render();}}function openOrder(){document.getElementById('orderModal').classList.add('open');}function closeOrder(){document.getElementById('orderModal').classList.remove('open');}function setP(el){document.querySelectorAll('[data-p]').forEach(c=>c.classList.remove('active'));el.classList.add('active');selectedPriority=el.dataset.p;}function saveOrder(){const name=document.getElementById('o_name').value.trim();if(!name)return;const qty=parseFloat(document.getElementById('o_qty').value)||1;const price=parseFloat(document.getElementById('o_price').value)||0;db.orders.push({id:Date.now()+'',month:curMonth,name,qty,price,priority:selectedPriority,done:false});save();closeOrder();render();}function toggleOrder(id){const o=db.orders.find(x=>x.id===id);o.done=!o.done;save();render();}function delOrder(id){if(confirm('Delete?')){db.orders=db.orders.filter(x=>x.id!==id);save();render();}}function copyLink(){navigator.clipboard.writeText(location.href);alert(L('copyLink'));}function shareWhats(){window.open('https://wa.me/?text='+encodeURIComponent(location.href));}function shareNative(){if(navigator.share)navigator.share({title:db.settings.lang==='ar'?db.settings.appName:db.settings.appNameEn,url:location.href});else copyLink();}function exportData(){const blob=new Blob([JSON.stringify(db)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='masroof-backup.json';a.click();}function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();location.reload();}catch{alert('Invalid');}};r.readAsText(f);}function clearData(){if(confirm(L('deleteAll'))){localStorage.removeItem('masroof_v3');location.reload();}}function drawChart(){const c=document.getElementById('chart');if(!c)return;const ctx=c.getContext('2d');const{ex,total}=getMonthData(curMonth);const byCat={};ex.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.amount);const entries=Object.entries(byCat);if(!entries.length)return;const W=c.width=c.clientWidth*2;const H=c.height=180*2;ctx.clearRect(0,0,W,H);let s=0;entries.forEach(([id,amt],i)=>{const a=total?(amt/total)*Math.PI*2:0;ctx.beginPath();ctx.moveTo(W/2,H/2);ctx.fillStyle=['#0f4c75','#3282b8','#10b981','#f59e0b','#ef4444','#8b5cf6'][i%6];ctx.arc(W/2,H/2,Math.min(W,H)/2-20,s,s+a);ctx.closePath();ctx.fill();s+=a;});}init();</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script></body></html>
