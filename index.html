<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masroof</title><style>*{box-sizing:border-box;font-family:Tahoma}body{margin:0;background:#f0f9ff;padding:12px}.card{background:#fff;border-radius:16px;padding:16px;margin:0 auto 12px;max-width:600px;box-shadow:0 2px 8px #0001}.h{display:flex;justify-content:space-between;align-items:center}button{border:0;border-radius:10px;padding:10px 14px;font-weight:bold;cursor:pointer}.btn-blue{background:#0ea5e9;color:#fff;width:100%}.btn-lang{background:#e0f2fe;color:#0284c7}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:8px 0}.item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9}</style></head><body><div class="card"><div class="h"><h2 id="t">مصروف البيت</h2><button id="lb" class="btn-lang" onclick="toggleLang()">English</button></div><p id="d" style="color:#64748b;font-size:13px"></p><input id="inp" placeholder="خبز 2 دينار"><button id="ab" class="btn-blue" onclick="add()">اضافة</button></div><div class="card"><div class="h"><span id="bl">المصروفات</span><b id="tot">0 JD</b></div><div id="list"></div><button id="cb" style="background:#fee2e2;color:#dc2626;width:100%;margin-top:10px" onclick="clearAll()">مسح الكل</button></div><script>let L=localStorage.lang||'ar';let D=JSON.parse(localStorage.ex||'[]');let T={ar:{t:'مصروف البيت',b:'English',p:'خبز 2 دينار',a:'اضافة',l:'المصروفات',c:'مسح الكل',e:'لا يوجد مصروفات',m:'متأكد؟'},en:{t:'Home Expenses',b:'العربية',p:'Bread 2 JD',a:'Add',l:'Expenses',c:'Clear All',e:'No expenses',m:'Clear?'}};function R(){document.documentElement.dir=L=='ar'?'rtl':'ltr';let tr=T[L];document.getElementById('t').innerText=tr.t;document.getElementById('lb').innerText=tr.b;document.getElementById('inp').placeholder=tr.p;document.getElementById('ab').innerText=tr.a;document.getElementById('bl').innerText=tr.l;document.getElementById('cb').innerText=tr.c;document.getElementById('d').innerText=new Date().toLocaleDateString(L=='ar'?'ar-JO':'en',{weekday:'long',year:'numeric',month:'long',day:'numeric'});render();}function toggleLang(){L=L=='ar'?'en':'ar';localStorage.lang=L;R();}function render(){let list=document.getElementById('list');if(!D.length){list.innerHTML='<p style=color:#64748b>'+T[L].e+'</p>';document.getElementById('tot').innerText='0 JD';return;}let h='';let tot=0;D.forEach((v,i)=>{let n=parseFloat((v.match(/\d+/)||[0])[0])||0;tot+=n;h+=`<div class=item><span>${v}</span><span onclick="del(${i})" style="color:red;cursor:pointer">X</span></div>`;});list.innerHTML=h;document.getElementById('tot').innerText=tot+' JD';}function add(){let e=document.getElementById('inp');let v=e.value.trim();if(!v)return;D.push(v);localStorage.ex=JSON.stringify(D);e.value='';render();}function del(i){D.splice(i,1);localStorage.ex=JSON.stringify(D);render();}function clearAll(){if(!confirm(T[L].m))return;D=[];localStorage.ex=JSON.stringify(D);render();}R();</script></body></html>
