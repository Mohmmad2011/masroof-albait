<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مصروف البيت</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Tahoma}
body{background:#f8fafc;color:#0f172a;transition:.3s}
body.dark{background:#0f172a;color:#f1f5f9}
.container{max-width:480px;margin:0 auto;padding:16px;padding-bottom:90px}
.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
body.dark.card{background:#1e293b}
.input{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin:6px 0;font-size:15px}
body.dark.input{background:#334155;color:white;border-color:#475569}
.btn{width:100%;padding:12px;background:#16a34a;color:white;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:16px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e2e8f0;display:flex;justify-content:around;padding:8px 0;z-index:10}
body.dark.bottom-nav{background:#1e293b;border-color:#334155}
.nav-item{flex:1;text-align:center;padding:6px;font-size:12px;cursor:pointer;color:#64748b}
.nav-item.active{color:#16a34a;font-weight:bold}
.badge{padding:2px 8px;border-radius:20px;font-size:12px;background:#dcfce7;color:#166534}
</style>
</head>
<body>
<div class="container">
<h1 style="text-align:center;margin:10px 0">🏠 <span id="appTitle">مصروف البيت</span></h1>
<div id="page-home"></div>
<div id="page-settings" style="display:none"></div>
<div id="page-history" style="display:none"></div>
</div>
<div class="bottom-nav">
<div class="nav-item active" onclick="showPage('home')">🏠<br>الرئيسية</div>
<div class="nav-item" onclick="showPage('history')">📜<br>السجل</div>
<div class="nav-item" onclick="showPage('settings')">⚙️<br>الإعدادات</div>
</div>
<script>
let db = JSON.parse(localStorage.getItem('masroof_db')||'null') || {
  expenses:[],
  settings:{ lang:'ar', currency:'USD', currencyEn:'USD', theme:'light', appName:'مصروف البيت', appNameEn:'Home Expenses' }
};
const T = {
  settingsTitle:{ar:'⚙️ الإعدادات',en:'⚙️ Settings'},
  appName:{ar:'📝 اسم التطبيق',en:'📝 App Name'},
  lang:{ar:'🌐 اللغة',en:'🌐 Language'},
  currency:{ar:'💱 العملة - كل عملات العالم',en:'💱 Currency - World Currencies'},
  theme:{ar:'🎨 المظهر',en:'🎨 Theme'},
  light:{ar:'☀️ نهاري',en:'☀️ Light'},
  dark:{ar:'🌙 ليلي',en:'🌙 Dark'},
  total:{ar:'المجموع الكلي',en:'Total'},
  today:{ar:'مصروف اليوم',en:"Today's"},
  add:{ar:'إضافة مصروف',en:'Add Expense'},
  amount:{ar:'المبلغ',en:'Amount'},
  note:{ar:'ملاحظة',en:'Note'},
  save:{ar:'حفظ',en:'Save'},
  history:{ar:'سجل المصاريف',en:'History'},
  noData:{ar:'لا يوجد مصاريف بعد',en:'No expenses yet'}
};
const CURRENCIES = [
  {code:'JOD', name:'دينار أردني', flag:'🇯🇴'},
  {code:'USD', name:'دولار أمريكي', flag:'🇺🇸'},
  {code:'EUR', name:'يورو', flag:'🇪🇺'},
  {code:'GBP', name:'جنيه إسترليني', flag:'🇬🇧'},
  {code:'SAR', name:'ريال سعودي', flag:'🇸🇦'},
  {code:'AED', name:'درهم إماراتي', flag:'🇦🇪'},
  {code:'QAR', name:'ريال قطري', flag:'🇶🇦'},
  {code:'KWD', name:'دينار كويتي', flag:'🇰🇼'},
  {code:'BHD', name:'دينار بحريني', flag:'🇧🇭'},
  {code:'OMR', name:'ريال عماني', flag:'🇴🇲'},
  {code:'EGP', name:'جنيه مصري', flag:'🇪🇬'},
  {code:'LBP', name:'ليرة لبنانية', flag:'🇱🇧'},
  {code:'SYP', name:'ليرة سورية', flag:'🇸🇾'},
  {code:'IQD', name:'دينار عراقي', flag:'🇮🇶'},
  {code:'YER', name:'ريال يمني', flag:'🇾🇪'},
  {code:'TRY', name:'ليرة تركية', flag:'🇹🇷'},
  {code:'MAD', name:'درهم مغربي', flag:'🇲🇦'},
  {code:'DZD', name:'دينار جزائري', flag:'🇩🇿'},
  {code:'TND', name:'دينار تونسي', flag:'🇹🇳'},
  {code:'LYD', name:'دينار ليبي', flag:'🇱🇾'},
  {code:'SDG', name:'جنيه سوداني', flag:'🇸🇩'},
  {code:'CAD', name:'دولار كندي', flag:'🇨🇦'},
  {code:'AUD', name:'دولار أسترالي', flag:'🇦🇺'},
  {code:'JPY', name:'ين ياباني', flag:'🇯🇵'},
  {code:'CNY', name:'يوان صيني', flag:'🇨🇳'},
  {code:'INR', name:'روبية هندية', flag:'🇮🇳'},
  {code:'PKR', name:'روبية باكستانية', flag:'🇵🇰'},
  {code:'BRL', name:'ريال برازيلي', flag:'🇧🇷'},
  {code:'RUB', name:'روبل روسي', flag:'🇷🇺'},
  {code:'ZAR', name:'راند جنوب أفريقي', flag:'🇿🇦'},
  {code:'CHF', name:'فرنك سويسري', flag:'🇨🇭'},
  {code:'SEK', name:'كرونة سويدية', flag:'🇸🇪'},
  {code:'NOK', name:'كرونة نرويجية', flag:'🇳🇴'},
  {code:'DKK', name:'كرونة دنماركية', flag:'🇩🇰'},
  {code:'SGD', name:'دولار سنغافوري', flag:'🇸🇬'},
  {code:'MYR', name:'رينغيت ماليزي', flag:'🇲🇾'},
  {code:'IDR', name:'روبية إندونيسية', flag:'🇮🇩'},
  {code:'THB', name:'بات تايلندي', flag:'🇹🇭'},
  {code:'KRW', name:'وون كوري', flag:'🇰🇷'},
  {code:'NGN', name:'نايرا نيجيري', flag:'🇳🇬'}
];
function save(){ localStorage.setItem('masroof_db', JSON.stringify(db)); }
function CF(n){ const cur = db.settings.currency || 'JOD'; return (Number(n)||0).toFixed(2)+' '+cur; }
function changeCurrency(val){ db.settings.currency = val; db.settings.currencyEn = val; save(); render(); alert('تم تغيير العملة إلى '+val+' ✅'); }
function showPage(p){
  document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
  document.getElementById('page-home').style.display = p==='home'?'block':'none';
  document.getElementById('page-settings').style.display = p==='settings'?'block':'none';
  document.getElementById('page-history').style.display = p==='history'?'block':'none';
  if(p==='home') document.querySelectorAll('.nav-item')[0].classList.add('active');
  if(p==='history') document.querySelectorAll('.nav-item')[1].classList.add('active');
  if(p==='settings') document.querySelectorAll('.nav-item')[2].classList.add('active');
  render();
}
function renderSettings(){
  const s = db.settings; const isAr = s.lang==='ar';
  let currOptions = CURRENCIES.map(c=>`<option value="${c.code}" ${s.currency===c.code?'selected':''}>${c.flag} ${c.code} - ${c.name}</option>`).join('');
  document.getElementById('page-settings').innerHTML = `
    <div class="card">
      <h3>${T.settingsTitle[isAr?'ar':'en']}</h3><br>
      <label>${T.appName[isAr?'ar':'en']}</label>
      <input class="input" value="${isAr?s.appName:s.appNameEn||s.appName}" oninput="db.settings.${isAr?'appName':'appNameEn'}=this.value;save();document.getElementById('appTitle').innerText=this.value">
      <label>${T.lang[isAr?'ar':'en']}</label>
      <select class="input" onchange="db.settings.lang=this.value;save();render()">
        <option value="ar" ${s.lang==='ar'?'selected':''}>العربية</option>
        <option value="en" ${s.lang==='en'?'selected':''}>English</option>
      </select>
      <label style="font-weight:bold;color:#16a34a">${T.currency[isAr?'ar':'en']} 🌍</label>
      <select class="input" style="border:2px solid #16a34a;font-weight:bold" onchange="changeCurrency(this.value)">
        ${currOptions}
      </select>
      <small style="color:#16a34a">✅ 40 عملة عالمية جاهزة!</small><br><br>
      <label>${T.theme[isAr?'ar':'en']}</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <button class="btn" style="background:${s.theme==='light'?'#16a34a':'#94a3b8'}" onclick="db.settings.theme='light';document.body.classList.remove('dark');save();render()">${T.light[isAr?'ar':'en']}</button>
        <button class="btn" style="background:${s.theme==='dark'?'#16a34a':'#94a3b8'}" onclick="db.settings.theme='dark';document.body.classList.add('dark');save();render()">${T.dark[isAr?'ar':'en']}</button>
      </div>
    </div>
  `;
}
function renderHome(){
  const s = db.settings; const isAr = s.lang==='ar';
  const total = db.expenses.reduce((a,b)=>a+Number(b.amount),0);
  const todayTotal = db.expenses.filter(e=>e.date===new Date().toISOString().slice(0,10)).reduce((a,b)=>a+Number(b.amount),0);
  document.getElementById('page-home').innerHTML = `
    <div class="card" style="background:linear-gradient(135deg,#16a34a,#22c55e);color:white;text-align:center">
      <small>${T.total[isAr?'ar':'en']}</small>
      <h1 style="font-size:32px;margin:8px 0">${CF(total)}</h1>
      <span class="badge">${T.today[isAr?'ar':'en']}: ${CF(todayTotal)}</span>
    </div>
    <div class="card">
      <h3>${T.add[isAr?'ar':'en']}</h3>
      <input id="amt" class="input" type="number" placeholder="${T.amount[isAr?'ar':'en']}">
      <input id="note" class="input" placeholder="${T.note[isAr?'ar':'en']}">
      <button class="btn" onclick="addExpense()">➕ ${T.save[isAr?'ar':'en']}</button>
    </div>
  `;
  document.getElementById('appTitle').innerText = isAr? s.appName : (s.appNameEn||s.appName);
  if(s.theme==='dark') document.body.classList.add('dark'); else document.body.classList.remove('dark');
}
function renderHistory(){
  const s = db.settings; const isAr = s.lang==='ar';
  if(db.expenses.length===0){ document.getElementById('page-history').innerHTML = `<div class="card" style="text-align:center">${T.noData[isAr?'ar':'en']}</div>`; return; }
  let html = `<div class="card"><h3>${T.history[isAr?'ar':'en']}</h3></div>`;
  db.expenses.slice().reverse().forEach((e)=>{ html += `<div class="card" style="display:flex;justify-content:space-between"><div><b>${e.note||'مصروف'}</b><br><small>${e.date}</small></div><div><b style="color:#dc2626">${CF(e.amount)}</b></div></div>`; });
  document.getElementById('page-history').innerHTML = html;
}
function addExpense(){
  const amt = document.getElementById('amt').value; const note = document.getElementById('note').value;
  if(!amt) return alert('ادخل المبلغ');
  db.expenses.push({amount:Number(amt), note, date:new Date().toISOString().slice(0,10), id:Date.now()});
  save(); document.getElementById('amt').value=''; document.getElementById('note').value=''; render(); alert('تم الحفظ ✅');
}
function render(){ renderHome(); renderSettings(); renderHistory(); }
render();
</script>
</body>
</html>
