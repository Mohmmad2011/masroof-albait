<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f4c75"><link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.json"><title>مصروف البيت</title><style>:root{--p:#0f4c75;--bg:#f7fbff;--card:#fff;--b:#dbeafe;--mut:#6b7280;--ok:#16a34a;--bad:#ef4444;--r:18px}*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);color:#0f172a;padding-bottom:80px}body.en{font-family:system-ui;direction:ltr}header{background:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px #0001;position:sticky;top:0;z-index:9}button{cursor:pointer}.lang{border:0;background:#eef2ff;color:#4338ca;padding:7px 14px;border-radius:20px;font-weight:700}.wrap{max-width:480px;margin:0 auto;padding:12px}.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 2px 10px #0001;margin-bottom:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.k{background:#f1f5f9;border-radius:14px;padding:10px;text-align:center}.k b{display:block;margin-top:4px}.prog{height:7px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin-top:10px}.bar{height:100%;background:var(--p)}.row{display:flex;justify-content:space-between;padding:10px 12px;background:#fff;border-radius:14px;margin-bottom:6px;box-shadow:0 1px 2px #0001}.fab{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;border:0;background:var(--p);color:#fff;font-size:30px;box-shadow:0 8px 18px #0f4c7566}.overlay{display:none;position:fixed;inset:0;background:#0006;z-index:30;align-items:flex-end}.overlay.open{display:flex}.sheet{background:#fff;width:100%;max-width:480px;margin:0 auto;border-radius:20px 20px 0 0;padding:16px;max-height:90vh;overflow:auto}.inp{width:100%;padding:11px;border:1px solid var(--b);border-radius:10px;margin-bottom:8px}.btn{width:100%;background:var(--p);color:#fff;border:0;padding:12px;border-radius:10px;font-weight:700}.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}.c{border:1px solid var(--b);border-radius:10px;padding:8px;background:#fff;font-size:12px;text-align:center}.c.active{background:#eef2ff;border-color:#6366f1;color:#4338ca;font-weight:700}.top{font-size:12px;color:var(--mut)}.nav{display:flex;gap:6px;overflow:auto;margin-bottom:8px}.nav button{border:1px solid var(--b);background:#fff;padding:7px 12px;border-radius:20px;white-space:nowrap}.nav button.active{background:var(--p);color:#fff;border-color:var(--p)}</style></head><body id="bd"><header><b id="appNameTitle">🏠 مصروف البيت</b><div style="display:flex;gap:8px;align-items:center"><span id="clock" style="font-size:11px;color:#64748b;background:#f1f5f9;padding:4px 8px;border-radius:10px"></span><button class="lang" onclick="toggleLang()" id="langBtn">English</button></div></header><div class="wrap"><div style="display:flex;gap:8px;margin-bottom:10px"><input id="monthInput" type="month" class="inp" style="margin:0"><button onclick="editBudget()" class="lang" style="white-space:nowrap" id="editBudBtn">تعديل الميزانية</button></div><div class="card"><div style="display:flex;justify-content:space-between;font-weight:700"><span id="monthLabel">الميزانية</span><span id="pc">0%</span></div><div class="grid3" style="margin-top:10px"><div class="k"><span class="top" id="lBud">ميزانية</span><b id="bBud">0</b></div><div class="k"><span class="top" id="lExp">مصروف</span><b id="bExp" style="color:var(--bad)">0</b></div><div class="k"><span class="top" id="lRem">الباقي</span><b id="bRem" style="color:var(--ok)">0</b></div></div><div class="prog"><div class="bar" id="bar"></div></div></div><div class="nav" id="filterNav"></div><div id="appMain"></div></div><button class="fab" onclick="openAdd()">+</button><div class="overlay" id="ovAdd" onclick="if(event.target==this)closeAdd()"><div class="sheet"><b id="addTitle">إضافة مصروف</b><br><br><input id="amountInput" class="inp" type="number" placeholder="المبلغ"><input id="noteInput" class="inp" placeholder="ملاحظة (اختياري)"><div class="cats" id="catGrid"></div><select id="prioSel" class="inp"><option value="عالية">عالية</option><option value="متوسطة">متوسطة</option><option value="منخفضة">منخفضة</option></select><button class="btn" onclick="saveExp()" id="saveBtn">حفظ</button></div></div><div class="overlay" id="ovBud" onclick="if(event.target==this)closeBud()"><div class="sheet"><b id="budTitle">تعديل الميزانية</b><br><br><input id="budInput" class="inp" type="number" placeholder="الميزانية"><button class="btn" onclick="saveBud()" id="budSave">حفظ</button></div></div><script>let db=JSON.parse(localStorage.getItem('masroof_v3')||'null')||{budgets:{},expenses:[],orders:[],cats:[{id:'super',name:'السوبر ماركت',nameEn:'Supermarket',icon:'🛒'},{id:'rent',name:'إيجار البيت',nameEn:'Rent',icon:'🏠'},{id:'food',name:'مطاعم',nameEn:'Restaurants',icon:'🍔'},{id:'trans',name:'مواصلات',nameEn:'Transport',icon:'🚕'},{id:'bills',name:'فواتير',nameEn:'Bills',icon:'💡'},{id:'health',name:'صحة',nameEn:'Health',icon:'💊'}],settings:{lang:localStorage.getItem('lang')||'ar',currency:'د.أ',appName:'مصروف البيت'}};db.cats=db.cats.map(c=>{if(!c.nameEn){const map={super:'Supermarket',rent:'Rent',food:'Restaurants',trans:'Transport',bills:'Bills',health:'Health'};c.nameEn=map[c.id]||c.name}return c});let curMonth=new Date().toISOString().slice(0,7),curPage='home',selectedCat=null,selectedPriority='عالية',editId=null,filterCat='all',searchQ='';const T={ar:{app:'🏠 مصروف البيت',enBtn:'English',budget:'الميزانية',spent:'مصروف',remain:'الباقي',editBud:'تعديل الميزانية',used:'المستخدم',add:'إضافة مصروف',amount:'المبلغ',note:'ملاحظة (اختياري)',save:'حفظ',high:'عالية',med:'متوسطة',low:'منخفضة',all:'الكل',noExp:'لا يوجد مصروفات',tapAdd:'اضغط + لإضافة',budTitle:'تعديل الميزانية'},en:{app:'🏠 Home Expenses',enBtn:'العربية',budget:'Budget',spent:'Spent',remain:'Remaining',editBud:'Edit Budget',used:'Used',add:'Add Expense',amount:'Amount',note:'Note (optional)',save:'Save',high:'High',med:'Medium',low:'Low',all:'All',noExp:'No expenses',tapAdd:'Tap + to add',budTitle:'Edit Budget'}};function L(k){return T[db.settings.lang][k]}function catName(c){return db.settings.lang==='ar'?c.name:c.nameEn}function save(){localStorage.setItem('masroof_v3',JSON.stringify(db));localStorage.setItem('lang',db.settings.lang)}function fmt(n){return (Number(n)||0).toFixed(2)+' '+(db.settings.lang==='ar'?db.settings.currency:'JOD')}function monthLabel(m){const d=new Date(m+'-01');return d.toLocaleDateString(db.settings.lang==='ar'?'ar-EG':'en-US',{month:'long',year:'numeric'})}function toggleLang(){db.settings.lang=db.settings.lang==='ar'?'en':'ar';document.documentElement.lang=db.settings.lang;document.documentElement.dir=db.settings.lang==='ar'?'rtl':'ltr';document.getElementById('bd').className=db.settings.lang==='en'?'en':'';save();applySettings();render();}function applySettings(){document.getElementById('appNameTitle').textContent=L('app');document.getElementById('langBtn').textContent=L('enBtn');document.getElementById('lBud').textContent=L('budget');document.getElementById('lExp').textContent=L('spent');document.getElementById('lRem').textContent=L('remain');document.getElementById('editBudBtn').textContent=L('editBud');document.getElementById('addTitle').textContent=L('add');document.getElementById('budTitle').textContent=L('budTitle');document.getElementById('amountInput').placeholder=L('amount');document.getElementById('noteInput').placeholder=L('note');document.getElementById('saveBtn').textContent=L('save');document.getElementById('budSave').textContent=L('save');document.getElementById('prioSel').options[0].text=L('high');document.getElementById('prioSel').options[1].text=L('med');document.getElementById('prioSel').options[2].text=L('low');document.getElementById('monthLabel').textContent=monthLabel(curMonth);}function init(){document.getElementById('monthInput').value=curMonth;document.getElementById('monthInput').addEventListener('change',e=>{curMonth=e.target.value;render()});document.documentElement.lang=db.settings.lang;document.documentElement.dir=db.settings.lang==='ar'?'rtl':'ltr';document.getElementById('bd').className=db.settings.lang==='en'?'en':'';applySettings();render();setInterval(()=>{const el=document.getElementById('clock');if(el) el.textContent=new Date().toLocaleTimeString(db.settings.lang==='ar'?'ar-JO':'en-US',{hour:'2-digit',minute:'2-digit'})},1000)}function getMonthData(m){const ex=db.expenses.filter(e=>e.month===m);const total=ex.reduce((s,e)=>s+e.amount,0);const budget=db.budgets[m]||0;return{ex,total,budget,remaining:budget-total}}function render(){const{ex,total,budget,remaining}=getMonthData(curMonth);const percent=budget>0?Math.min(100,Math.round(total/budget*100)):0;document.getElementById('bBud').textContent=fmt(budget);document.getElementById('bExp').textContent=fmt(total);document.getElementById('bRem').textContent=fmt(remaining);document.getElementById('pc').textContent=percent+'%';document.getElementById('bar').style.width=percent+'%';document.getElementById('monthLabel').textContent=monthLabel(curMonth);renderCats();renderList(ex);renderFilter()}function renderCats(){document.getElementById('catGrid').innerHTML=db.cats.map(c=>`<button class="c ${selectedCat===c.id?'active':''}" onclick="selectedCat='${c.id}';renderCats()">${c.icon}<br>${catName(c)}</button>`).join('')}function renderFilter(){document.getElementById('filterNav').innerHTML=`<button class="${filterCat==='all'?'active':''}" onclick="filterCat='all';render()">${L('all')}</button>`+db.cats.map(c=>`<button class="${filterCat===c.id?'active':''}" onclick="filterCat='${c.id}';render()">${c.icon} ${catName(c)}</button>`).join('')}function renderList(ex){let list=filterCat==='all'?ex:ex.filter(e=>e.cat===filterCat);const main=document.getElementById('appMain');if(!list.length){main.innerHTML=`<div style="text-align:center;padding:30px;color:#94a3b8"><div style="font-size:36px">💸</div><b>${L('noExp')}</b><div class="top">${L('tapAdd')}</div></div>`;return}main.innerHTML=list.slice().reverse().map(e=>{const c=db.cats.find(x=>x.id===e.cat)||db.cats[0];return `<div class="row"><div>${c.icon} ${catName(c)} ${e.note?'- '+e.note:''}<div class="top">${e.date}</div></div><b>${fmt(e.amount)}</b></div>`}).join('')}function openAdd(){selectedCat=db.cats[0].id;editId=null;document.getElementById('amountInput').value='';document.getElementById('noteInput').value='';document.getElementById('ovAdd').classList.add('open');renderCats()}function closeAdd(){document.getElementById('ovAdd').classList.remove('open')}function editBudget(){document.getElementById('budInput').value=db.budgets[curMonth]||'';document.getElementById('ovBud').classList.add('open')}function closeBud(){document.getElementById('ovBud').classList.remove('open')}function saveBud(){db.budgets[curMonth]=+(document.getElementById('budInput').value||0);save();closeBud();render()}function saveExp(){const a=+(document.getElementById('amountInput').value);if(!a)return alert('amount');db.expenses.push({id:Date.now(),month:curMonth,amount:a,cat:selectedCat,note:document.getElementById('noteInput').value,priority:document.getElementById('prioSel').value,date:new Date().toLocaleDateString()});save();closeAdd();render()}init();</script></body></html>
