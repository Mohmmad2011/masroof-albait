<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مصروفات المنزل</title><link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--green:#0f6d38;--green-light:#e6f4ea;--red:#ef4444;--red-light:#fef2f2;--blue:#3b82f6;--blue-light:#eff6ff;--border:#e5e7eb}
[data-theme="dark"]{--bg:#0f0f0f;--card:#1e1e1e;--text:#f0f0f0;--muted:#9ca3af;--green:#22c55e;--green-light:#132a1a;--red:#f87171;--red-light:#2a1515;--blue:#60a5fa;--blue-light:#162032;--border:#2a2a2a}
*{box-sizing:border-box;font-family:Tajawal,system-ui}body{margin:0;background:var(--bg);color:var(--text);padding-bottom:90px}
header{background:var(--green);color:#fff;padding:16px;display:flex;flex-direction:column;gap:8px;position:sticky;top:0;z-index:10}
.container{max-width:600px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.05);border:1px solid var(--border)}
.top3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.box{border-radius:16px;padding:14px;text-align:center}.box small{display:block;color:var(--muted);font-size:13px}.box b{font-size:17px}
.box.green{background:var(--green-light);color:var(--green)}.box.red{background:var(--red-light);color:var(--red)}.box.blue{background:var(--blue-light);color:var(--blue)}
.circle{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) 0%, var(--border) 0%)}
.circle span{background:var(--card);width:72px;height:72px;border-radius:50%;display:grid;place-items:center;text-align:center}
.input,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text)}
.btn{background:var(--green);color:#fff;border:none;padding:12px;border-radius:12px;width:100%;font-weight:bold;cursor:pointer}
.expense{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);align-items:center;cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0;z-index:20}
.nav-item{cursor:pointer;text-align:center;flex:1;padding:4px;font-size:12px}.nav-item.active{color:var(--green);font-weight:bold}
.page{display:none}.page.active{display:block}
.fab{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#0f5c9a;color:#fff;width:60px;height:60px;border-radius:18px;border:none;font-size:30px;z-index:15}
</style>
</head>
<body>
<header>
<div style="width:100%;display:flex;justify-content:space-between;align-items:center">
<h1 style="margin:0;font-size:18px" data-t="title">🏠 مصروفات المنزل</h1>
<div style="display:flex;gap:6px;align-items:center">
<select id="langSel" style="width:auto;background:rgba(255,255,255,.2);color:#fff;border:none;padding:6px 8px;border-radius:8px">
<option value="ar">العربية</option><option value="en">English</option><option value="fr">Français</option><option value="tr">Türkçe</option><option value="ur">اردو</option>
</select>
<button id="themeToggle" style="background:rgba(255,255,255,.2);border:none;color:#fff;width:40px;height:40px;border-radius:50%">🌙</button>
</div>
</div>
<div id="liveDate" style="width:100%;text-align:center;background:rgba(255,255,255,.15);padding:8px;border-radius:12px;font-size:13px;line-height:1.6"></div>
</header>

<div class="container">
<div id="page-home" class="page active">
<div class="card" style="display:flex;justify-content:space-between"><span data-t="budget">📅 الميزانية</span><span id="monthName"></span></div>
<div class="top3"><div class="box blue"><small data-t="left">الباقي</small><b id="leftTxt">0.00</b></div><div class="box red"><small data-t="spent">مصروف</small><b id="spentTxt">0.00</b></div><div class="box green"><small data-t="budget2">الميزانية</small><b id="budgetTxt">0.00</b></div></div>
<div class="card"><div style="display:flex;align-items:center;gap:20px;justify-content:space-between"><div><div style="color:var(--muted)" data-t="howMuch">قديش صرفت؟</div><b id="spentBig" style="font-size:22px">0.00</b><div><small id="countTxt">0</small></div></div><div class="circle" id="circle"><span><b id="percentTxt">0%</b></span></div></div><div style="display:flex;gap:8px;margin-top:12px"><input id="salary" class="input" type="number"><button class="btn" style="width:auto" onclick="saveBudget()" data-t="save">حفظ</button></div></div>
<div class="card"><b data-t="lastExp">📋 آخر المصروفات - اضغط للتعديل</b><div id="list" style="margin-top:10px"></div><div style="display:flex;gap:10px;margin-top:14px"><input id="eName" class="input" placeholder="الاسم"><input id="ePrice" class="input" type="number" placeholder="السعر"><button class="btn" style="width:auto" onclick="addExpense()">+</button></div></div>
</div>

<div id="page-log" class="page"><div class="card"><h3 data-t="logTitle">📄 السجل</h3><div id="logList"></div><button class="btn" style="margin-top:10px;background:var(--red)" onclick="clearAll()" data-t="clear">مسح الكل</button></div></div>
<div id="page-orders" class="page"><div class="card"><h3 data-t="ordersTitle">🛒 الطلبيات</h3><div style="display:flex;gap:8px"><input id="oName" class="input" placeholder="الطلب"><input id="oPrice" class="input" type="number"><button class="btn" style="width:auto" onclick="addOrder()">+</button></div><div id="ordersList" style="margin-top:12px"></div></div></div>
<div id="page-reports" class="page"><div class="card"><h3 data-t="reportsTitle">📊 التقارير</h3><div id="reportsBox"></div><div id="topCats" style="margin-top:10px"></div></div></div>
<div id="page-settings" class="page"><div class="card"><h3 data-t="settingsTitle">⚙️ الإعدادات</h3><label data-t="langLabel">اللغة</label><select id="langSel2" class="input" style="margin:8px 0"><option value="ar">العربية</option><option value="en">English</option><option value="fr">Français</option><option value="tr">Türkçe</option><option value="ur">اردو</option></select><p data-t="settingsDesc" style="color:var(--muted)">غيّر اللغة والوضع الليلي.</p><button class="btn" style="background:#ef4444;margin-top:10px" onclick="if(confirm('مسح؟')){localStorage.clear();location.reload()}" data-t="deleteAll">مسح كل البيانات</button></div></div>
</div>

<div class="bottom-nav">
<div class="nav-item active" onclick="switchTab('home')" data-tab="home">🏠<br><span data-t="navHome">الرئيسية</span></div>
<div class="nav-item" onclick="switchTab('log')" data-tab="log">📄<br><span data-t="navLog">السجل</span></div>
<div class="nav-item" onclick="switchTab('orders')" data-tab="orders">🛒<br><span data-t="navOrders">الطلبيات</span></div>
<div class="nav-item" onclick="switchTab('reports')" data-tab="reports">📊<br><span data-t="navReports">التقارير</span></div>
<div class="nav-item" onclick="switchTab('settings')" data-tab="settings">⚙️<br><span data-t="navSettings">الإعدادات</span></div>
</div>

<script>
const trans={ar:{title:"🏠 مصروفات المنزل",budget:"📅 الميزانية",left:"الباقي",spent:"مصروف",budget2:"الميزانية",howMuch:"قديش صرفت؟",save:"حفظ",lastExp:"📋 آخر المصروفات - اضغط للتعديل",logTitle:"📄 السجل الكامل",clear:"مسح الكل",ordersTitle:"🛒 الطلبيات / الديون",reportsTitle:"📊 التقارير",settingsTitle:"⚙️ الإعدادات",langLabel:"اللغة",settingsDesc:"اختر اللغة من فوق، والوضع الليلي من زر القمر.",deleteAll:"مسح كل البيانات",navHome:"الرئيسية",navLog:"السجل",navOrders:"الطلبيات",navReports:"التقارير",navSettings:"الإعدادات"},en:{title:"🏠 Home Expenses",budget:"📅 Budget",left:"Left",spent:"Spent",budget2:"Budget",howMuch:"How much spent?",save:"Save",lastExp:"📋 Last Expenses - tap to edit",logTitle:"📄 Full Log",clear:"Clear All",ordersTitle:"🛒 Orders / Debts",reportsTitle:"📊 Reports",settingsTitle:"⚙️ Settings",langLabel:"Language",settingsDesc:"Choose language and dark mode.",deleteAll:"Delete All Data",navHome:"Home",navLog:"Log",navOrders:"Orders",navReports:"Reports",navSettings:"Settings"},fr:{title:"🏠 Dépenses",budget:"📅 Budget",left:"Reste",spent:"Dépensé",budget2:"Budget",howMuch:"Combien dépensé?",save:"Sauver",lastExp:"📋 Dernières - tap pour modifier",logTitle:"📄 Journal",clear:"Effacer",ordersTitle:"🛒 Commandes",reportsTitle:"📊 Rapports",settingsTitle:"⚙️ Paramètres",langLabel:"Langue",settingsDesc:"Choisissez la langue.",deleteAll:"Supprimer tout",navHome:"Accueil",navLog:"Journal",navOrders:"Commandes",navReports:"Rapports",navSettings:"Paramètres"},tr:{title:"🏠 Ev Giderleri",budget:"📅 Bütçe",left:"Kalan",spent:"Harcanan",budget2:"Bütçe",howMuch:"Ne kadar?",save:"Kaydet",lastExp:"📋 Son Giderler",logTitle:"📄 Kayıtlar",clear:"Temizle",ordersTitle:"🛒 Siparişler",reportsTitle:"📊 Raporlar",settingsTitle:"⚙️ Ayarlar",langLabel:"Dil",settingsDesc:"Dili seçin.",deleteAll:"Tümünü Sil",navHome:"Ana",navLog:"Kayıt",navOrders:"Sipariş",navReports:"Rapor",navSettings:"Ayar"},ur:{title:"🏠 گھر کے اخراجات",budget:"📅 بجٹ",left:"باقی",spent:"خرچ",budget2:"بجٹ",howMuch:"کتنا خرچ؟",save:"محفوظ",lastExp:"📋 آخری اخراجات",logTitle:"📄 ریکارڈ",clear:"صاف کریں",ordersTitle:"🛒 آرڈرز",reportsTitle:"📊 رپورٹس",settingsTitle:"⚙️ ترتیبات",langLabel:"زبان",settingsDesc:"زبان منتخب کریں۔",deleteAll:"سب ڈیلیٹ",navHome:"ہوم",navLog:"لاگ",navOrders:"آرڈرز",navReports:"رپورٹس",navSettings:"سیٹنگز"}};
let curLang=localStorage.getItem('appLang')||'ar';
function applyLang(l){curLang=l;localStorage.setItem('appLang',l);let t=trans[l]||trans.ar;document.querySelectorAll('[data-t]').forEach(el=>{let k=el.getAttribute('data-t');if(t[k])el.textContent=t[k];});document.documentElement.dir=(l==='ar'||l==='ur')?'rtl':'ltr';document.documentElement.lang=l;document.getElementById('langSel').value=l;document.getElementById('langSel2').value=l;}
document.getElementById('langSel').onchange=e=>applyLang(e.target.value);document.getElementById('langSel2').onchange=e=>applyLang(e.target.value);
function switchTab(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+n).classList.add('active');document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));document.querySelector('[data-tab="'+n+'"]').classList.add('active');}
let th=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',th);let tb=document.getElementById('themeToggle');tb.textContent=th==='dark'?'☀️':'🌙';tb.onclick=()=>{th=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',th);localStorage.setItem('theme',th);tb.textContent=th==='dark'?'☀️':'🌙';};
let data=JSON.parse(localStorage.getItem('home_exp_v2')||'{"budget":0,"exp":[],"orders":[]}');if(!data.orders)data.orders=[];
document.getElementById('monthName').textContent=new Date().toLocaleDateString('ar-JO',{month:'long',year:'numeric'});
function saveBudget(){data.budget=+document.getElementById('salary').value||0;save();}
function addExpense(){let n=document.getElementById('eName').value,p=+document.getElementById('ePrice').value;if(!n||!p)return;data.exp.push({n,p,d:new Date().toLocaleDateString('ar-JO')});document.getElementById('eName').value='';document.getElementById('ePrice').value='';save();}
function addOrder(){let n=document.getElementById('oName').value,p=+document.getElementById('oPrice').value;if(!n||!p)return;data.orders.push({n,p,d:new Date().toLocaleDateString('ar-JO')});document.getElementById('oName').value='';document.getElementById('oPrice').value='';save();}
function save(){localStorage.setItem('home_exp_v2',JSON.stringify(data));render();}
function render(){let spent=data.exp.reduce((a,b)=>a+b.p,0);let left=data.budget-spent;let perc=data.budget?Math.min(100,Math.round(spent/data.budget*100)):0;document.getElementById('budgetTxt').textContent=data.budget.toFixed(2)+' د.أ';document.getElementById('spentTxt').textContent=spent.toFixed(2)+' د.أ';document.getElementById('leftTxt').textContent=left.toFixed(2)+' د.أ';document.getElementById('spentBig').textContent=spent.toFixed(2)+' د.أ';document.getElementById('countTxt').textContent=data.exp.length+' عملات';document.getElementById('percentTxt').textContent=perc+'%';document.getElementById('circle').style.background='conic-gradient(var(--green) '+perc+'%, var(--border) '+perc+'%)';document.getElementById('list').innerHTML=data.exp.slice(-5).reverse().map((e,idx)=>{let ri=data.exp.length-1-idx;return '<div class="expense" onclick="editExp('+ri+')"><span>'+e.n+' <small style="color:var(--muted)">'+e.d+'</small> ✏️</span><span>'+e.p.toFixed(2)+'</span></div>'}).join('')||'لا يوجد';renderLog();renderReports();renderOrders();}
function renderLog(){document.getElementById('logList').innerHTML=data.exp.map((e,i)=>'<div class="expense"><span onclick="editExp('+i+')" style="flex:1">'+e.n+' <small>'+e.d+'</small> ✏️</span><span>'+e.p.toFixed(2)+' <button onclick="delExp('+i+')" style="color:red;border:none;background:none">🗑️</button></span></div>').reverse().join('')||'لا يوجد';}
function renderOrders(){document.getElementById('ordersList').innerHTML=data.orders.map((e,i)=>'<div class="expense"><span>'+e.n+' <small>'+e.d+'</small></span><span>'+e.p.toFixed(2)+' <button onclick="delOrder('+i+')" style="color:red;border:none;background:none">🗑️</button></span></div>').reverse().join('')||'لا يوجد';}
function renderReports(){let spent=data.exp.reduce((a,b)=>a+b.p,0);let map={};data.exp.forEach(e=>{map[e.n]=(map[e.n]||0)+e.p});let sorted=Object.entries(map).sort((a,b)=>b[1]-a[1]);document.getElementById('reportsBox').innerHTML='<p>إجمالي: '+spent.toFixed(2)+' د.أ</p><p>عدد العمليات: '+data.exp.length+'</p><p>الباقي: '+(data.budget-spent).toFixed(2)+' د.أ</p>';document.getElementById('topCats').innerHTML=sorted.map(([k,v])=>'<div style="display:flex;justify-content:space-between;padding:6px 0"><span>'+k+'</span><b>'+v.toFixed(2)+'</b></div>').join('')||'لا يوجد';}
function editExp(i){let e=data.exp[i];let newName=prompt('عدل الاسم:',e.n);if(newName===null)return;let newPrice=prompt('عدل السعر:',e.p);if(newPrice===null)return;data.exp[i].n=newName||e.n;data.exp[i].p=+newPrice||e.p;save();}
function delExp(i){if(confirm('تحذف؟')){data.exp.splice(i,1);save();}}
function delOrder(i){let ri=data.orders.length-1-i;data.orders.splice(ri,1);save();}
function clearAll(){if(confirm('مسح الكل؟')){data.exp=[];save();}}
function updateClock(){let now=new Date();let days=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];let day=days[now.getDay()];let d=now.toLocaleDateString('ar-JO',{day:'numeric',month:'long',year:'numeric'});let t=now.toLocaleTimeString('ar-JO',{hour:'2-digit',minute:'2-digit',second:'2-digit'});let hij='';try{hij=new Intl.DateTimeFormat('ar-SA-islamic',{day:'numeric',month:'long',year:'numeric'}).format(now)}catch(e){}let el=document.getElementById('liveDate');if(el)el.innerHTML='📅 '+day+' • '+d+'<br>🕐 '+t+(hij?' • 🕌 '+hij:'');}setInterval(updateClock,1000);updateClock();applyLang(curLang);render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
