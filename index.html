<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مصروف البيت</title><style>:root{--bg:#f7f8fb;--card:#fff;--text:#0f172a;--muted:#64748b;--primary:#0f4c75;--primary2:#3282b8;--green:#10b981;--red:#ef4444;--border:#e2e8f0;--shadow:0 8px 24px rgba(15,23,42,.06)}.dark{--bg:#0b1220;--card:#111c2e;--text:#e2e8f0;--muted:#94a3b8;--primary:#38bdf8;--primary2:#0ea5e9;--border:#1e293b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma;background:var(--bg);color:var(--text)}header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:800;font-size:20px}.monthSel{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--border);padding:6px 10px;border-radius:12px}.monthSel input{background:transparent;border:0;color:var(--text);font-weight:700;width:130px}.main{padding:14px 12px 90px;max-width:520px;margin:auto}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.stat{text-align:center;padding:10px;border-radius:14px}.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:var(--muted)}.progress{position:relative;width:110px;height:110px;margin:auto}.progress svg{transform:rotate(-90deg)}.badge{padding:4px 8px;border-radius:99px;font-size:11px;background:var(--bg);border:1px solid var(--border)}.btn{border:0;border-radius:14px;padding:12px 14px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;width:100%}.btn-ghost{background:var(--bg);border:1px solid var(--border);color:var(--text)}.input{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);outline:0}label{font-size:12px;color:var(--muted);margin:8px 0 4px;display:block;font-weight:700}.row{display:flex;gap:8px}.categories{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cat{padding:12px;border-radius:14px;background:var(--bg);border:1px solid var(--border);display:flex;gap:8px;align-items:center;cursor:pointer}.cat.active{border-color:var(--primary);background:rgba(14,165,233,.12)}.listItem{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}.listItem:last-child{border:0}.bottomNav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 4px;z-index:30;max-width:520px;margin:auto}.navBtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:12px;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer}.navBtn.active{color:var(--primary);background:var(--bg)}.fab{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:0;width:56px;height:56px;border-radius:18px;font-size:28px;box-shadow:0 10px 20px rgba(0,0,0,.2);z-index:29}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:40}.modal.open{display:flex}.sheet{background:var(--card);width:100%;max-width:520px;margin:auto;border-radius:22px 22px 0 0;padding:16px;max-height:92vh;overflow:auto}.chip{padding:6px 10px;border-radius:99px;border:1px solid var(--border);background:var(--bg);font-size:12px;cursor:pointer}.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}canvas{width:100%;height:180px}.alert{padding:10px;border-radius:12px;font-size:13px;font-weight:700}.alert-warn{background:rgba(245,158,11,.15);color:#d97706;border:1px solid rgba(245,158,11,.3)}.alert-danger{background:rgba(239,68,68,.12);color:#dc2626;border:1px solid rgba(239,68,68,.3)}</style></head><body><header><div class="logo"><span>🏠</span><span id="appNameTitle">مصروف البيت</span></div><div class="monthSel">📅 <input type="month" id="monthInput"></div></header><div class="main" id="appMain"></div><button class="fab" onclick="openAdd()">+</button><div class="bottomNav"><button class="navBtn active" onclick="nav('home')" id="n-home">🏠<span>الرئيسية</span></button><button class="navBtn" onclick="nav('log')" id="n-log">📋<span>السجل</span></button><button class="navBtn" onclick="nav('orders')" id="n-orders">🛒<span>الطلبيات</span></button><button class="navBtn" onclick="nav('reports')" id="n-reports">📊<span>التقارير</span></button><button class="navBtn" onclick="nav('settings')" id="n-settings">⚙️<span>الإعدادات</span></button></div><div class="modal" id="addModal" onclick="if(event.target==this)closeAdd()"><div class="sheet"><h3 style="margin:0 0 10px">إضافة مصروف</h3><label>القسم</label><div id="catPicker" class="categories" style="max-height:180px;overflow:auto"></div><label>المبلغ (د.أ)</label><input id="f_amount" type="number" inputmode="decimal" class="input" placeholder="مثال: 15.50"><label>الوصف</label><input id="f_desc" class="input" placeholder="مثال: خضار، فاتورة..."><label>التاريخ</label><input id="f_date" type="date" class="input"><label>ملاحظة</label><input id="f_note" class="input" placeholder="ملاحظة..."><div style="height:10px"></div><div class="row"><button class="btn btn-ghost" onclick="closeAdd()" style="flex:1">إلغاء</button><button class="btn btn-primary" style="flex:2" onclick="saveExpense()">حفظ 💾</button></div></div></div><div class="modal" id="catModal" onclick="if(event.target==this)closeCat()"><div class="sheet"><h3>إدارة الأقسام</h3><div id="catManageList"></div><div style="height:10px"></div><label>إضافة قسم جديد</label><div class="row"><input id="newCatName" class="input" placeholder="مثال: هدايا"><input id="newCatIcon" class="input" style="max-width:80px" placeholder="🎁"><button class="btn btn-primary" onclick="addNewCat()">+</button></div><div style="height:10px"></div><button class="btn btn-ghost" style="width:100%" onclick="closeCat()">إغلاق</button></div></div><div class="modal" id="orderModal" onclick="if(event.target==this)closeOrder()"><div class="sheet"><h3>إضافة طلبية</h3><label>اسم المنتج</label><input id="o_name" class="input"><label>الكمية</label><input id="o_qty" type="number" class="input" value="1"><label>السعر المتوقع</label><input id="o_price" type="number" class="input"><label>الأولوية</label><div class="row" style="margin:6px 0"><button class="chip active" data-p="عالية" onclick="setP(this)">🔴 عالية</button><button class="chip" data-p="متوسطة" onclick="setP(this)">🟡 متوسطة</button><button class="chip" data-p="منخفضة" onclick="setP(this)">🟢 منخفضة</button></div><button class="btn btn-primary" onclick="saveOrder()">حفظ الطلبية</button></div></div><script>
let db=JSON.parse(localStorage.getItem('masroof_v3')||'null')||{budgets:{},expenses:[],orders:[],cats:[{id:'super',name:'السوبر ماركت',icon:'🛒'},{id:'rent',name:'إيجار البيت',icon:'🏠'},{id:'car',name:'قسط السيارة',icon:'🚗'},{id:'tel',name:'فواتير الاتصالات',icon:'📱'},{id:'elec',name:'الكهرباء',icon:'💡'},{id:'water',name:'الماء',icon:'💧'},{id:'net',name:'الإنترنت',icon:'🌐'},{id:'fuel',name:'البنزين',icon:'⛽'},{id:'pharm',name:'الصيدلية',icon:'💊'},{id:'school',name:'المدرسة',icon:'🎒'},{id:'rest',name:'المطاعم',icon:'🍔'},{id:'other',name:'مشتريات أخرى',icon:'🛍️'}],settings:{appName:'مصروف البيت',lang:'ar',currency:'د.أ',theme:'light',social:{fb:'',insta:'',tiktok:'',other:''}}};
let curMonth=new Date().toISOString().slice(0,7);let curPage='home';let selectedCat=null;let selectedPriority='عالية';let editId=null;let filterCat='all',searchQ='';
function save(){localStorage.setItem('masroof_v3',JSON.stringify(db));}
function fmt(n){return (Number(n)||0).toFixed(2)+' '+db.settings.currency;}
function monthLabel(m){const d=new Date(m+'-01');return d.toLocaleDateString(db.settings.lang==='ar'?'ar-EG':'en-US',{month:'long',year:'numeric'});}
function init(){document.getElementById('monthInput').value=curMonth;document.getElementById('monthInput').addEventListener('change',e=>{curMonth=e.target.value;render();});applySettings();nav('home');}
function applySettings(){document.getElementById('appNameTitle').textContent=db.settings.appName;document.documentElement.lang=db.settings.lang;document.documentElement.dir=db.settings.lang==='ar'?'rtl':'ltr';document.body.classList.toggle('dark',db.settings.theme==='dark');}
function nav(p){curPage=p;document.querySelectorAll('.navBtn').forEach(b=>b.classList.remove('active'));document.getElementById('n-'+p).classList.add('active');render();}
function render(){const main=document.getElementById('appMain');if(curPage==='home')main.innerHTML=renderHome();if(curPage==='log')main.innerHTML=renderLog();if(curPage==='orders')main.innerHTML=renderOrders();if(curPage==='reports')main.innerHTML=renderReports();if(curPage==='settings')main.innerHTML=renderSettings();if(curPage==='reports')setTimeout(drawChart,200);}
function getMonthData(m){const ex=db.expenses.filter(e=>e.month===m);const total=ex.reduce((s,e)=>s+e.amount,0);const budget=db.budgets[m]||0;const remaining=budget-total;return{ex,total,budget,remaining};}
function renderHome(){const{ex,total,budget,remaining}=getMonthData(curMonth);const percent=budget>0?Math.min(100,Math.round(total/budget*100)):0;const byCat={};ex.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.amount);const top=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,4);let warn='';if(budget>0){if(total>budget)warn=`<div class="alert alert-danger">⚠️ تجاوزت الميزانية! صرفت ${fmt(total)} من ${fmt(budget)}</div>`;else if(total/budget>0.8)warn=`<div class="alert alert-warn">⏰ اقتربت من الميزانية - ${percent}%</div>`;}return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>ميزانية ${monthLabel(curMonth)}</b><button class="badge" onclick="editBudget()">✏️ تعديل الميزانية</button></div><div class="grid3"><div class="stat" style="background:rgba(16,185,129,.12)"><span>الميزانية</span><b style="color:var(--green)">${fmt(budget)}</b></div><div class="stat" style="background:rgba(239,68,68,.1)"><span>مصروف</span><b style="color:var(--red)">${fmt(total)}</b></div><div class="stat" style="background:rgba(14,165,233,.12)"><span>الباقي</span><b style="color:${remaining<0?'var(--red)':'var(--primary)'}">${fmt(remaining)}</b></div></div><div style="display:flex;gap:12px;align-items:center;margin-top:14px;justify-content:center"><div class="progress"><svg width="110" height="110"><circle cx="55" cy="55" r="48" stroke="var(--border)" stroke-width="10" fill="none"/><circle cx="55" cy="55" r="48" stroke="${remaining<0?'#ef4444':'#0f4c75'}" stroke-width="10" fill="none" stroke-dasharray="${2*Math.PI*48}" stroke-dashoffset="${2*Math.PI*48*(1-percent/100)}" stroke-linecap="round"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><b style="font-size:22px">${percent}%</b><span style="font-size:11px;color:var(--muted)">من الميزانية</span></div></div><div style="flex:1">${warn||`<div style="font-size:13px;color:var(--muted)">قديش صرفت هذا الشهر؟<br><b style="font-size:18px;color:var(--text)">${fmt(total)}</b><br>${ex.length} عملية</div>`}</div></div></div><div class="card"><b>🔥 أكثر الأقسام صرفًا</b><div style="margin-top:8px">${top.length?top.map(([catId,amt])=>{const c=db.cats.find(x=>x.id===catId);return `<div class="row" style="justify-content:space-between;margin:6px 0"><span>${c?c.icon:''} ${c?c.name:catId}</span><b>${fmt(amt)}</b></div>`}).join(''):'<span style="color:var(--muted)">لا يوجد مصاريف بعد</span>'}</div></div><div class="card"><div style="display:flex;justify-content:space-between"><b>📋 آخر المصروفات</b><button class="badge" onclick="nav('log')">عرض الكل</button></div>${ex.slice(-5).reverse().map(e=>{const c=db.cats.find(x=>x.id===e.cat);return `<div class="listItem"><div><b>${c?c.icon:''} ${e.desc}</b><div style="font-size:11px;color:var(--muted)">${c?c.name:''} • ${e.date}</div></div><b style="color:var(--red)">-${fmt(e.amount)}</b></div>`}).join('')||'<div style="color:var(--muted);text-align:center;padding:12px">لا يوجد</div>'}</div><button class="btn btn-primary" onclick="openAdd()" style="margin-top:6px">+ إضافة مصروف سريع</button>`;}
function renderLog(){const{ex}=getMonthData(curMonth);let filtered=ex.filter(e=>{const okCat=filterCat==='all'||e.cat===filterCat;const okSearch=!searchQ||e.desc.includes(searchQ)||(e.note&&e.note.includes(searchQ));return okCat&&okSearch;}).sort((a,b)=>new Date(b.date)-new Date(a.date));return `<div class="card"><b>سجل مصروفات ${monthLabel(curMonth)}</b><div style="height:8px"></div><input class="input" placeholder="🔍 بحث..." value="${searchQ}" oninput="searchQ=this.value;render()"><div style="height:8px"></div><div style="display:flex;gap:6px;overflow:auto;padding-bottom:4px"><button class="chip ${filterCat==='all'?'active':''}" onclick="filterCat='all';render()">الكل</button>${db.cats.map(c=>`<button class="chip ${filterCat===c.id?'active':''}" onclick="filterCat='${c.id}';render()">${c.icon} ${c.name}</button>`).join('')}</div><div style="margin-top:8px">${filtered.map(e=>{const c=db.cats.find(x=>x.id===e.cat);return `<div class="listItem"><div><b>${c?c.icon:''} ${e.desc}</b><div style="font-size:11px;color:var(--muted)">${c?c.name:''} • ${e.date}${e.note?' • '+e.note:''}</div></div><div style="text-align:left"><b>${fmt(e.amount)}</b><div><button class="badge" onclick="editExpense('${e.id}')">✏️</button> <button class="badge" onclick="delExpense('${e.id}')">🗑️</button></div></div></div>`}).join('')||'<div style="text-align:center;color:var(--muted);padding:16px">لا يوجد نتائج</div>'}</div></div>`;}
function renderOrders(){const orders=db.orders.filter(o=>o.month===curMonth);const total=orders.reduce((s,o)=>s+o.qty*o.price,0);const pending=orders.filter(o=>!o.done).reduce((s,o)=>s+o.qty*o.price,0);return `<div class="card"><div style="display:flex;justify-content:space-between"><b>🛒 طلبيات ${monthLabel(curMonth)}</b><button class="btn btn-primary" style="width:auto;padding:8px 12px" onclick="openOrder()">+ طلبية</button></div><div class="grid3" style="margin-top:10px"><div class="stat" style="background:var(--bg)"><span>الإجمالي</span><b>${fmt(total)}</b></div><div class="stat" style="background:rgba(245,158,11,.12)"><span>غير مشتراة</span><b>${fmt(pending)}</b></div><div class="stat" style="background:rgba(16,185,129,.12)"><span>تم</span><b>${orders.filter(o=>o.done).length}/${orders.length}</b></div></div></div><div class="card">${orders.map(o=>`<div class="listItem"><div style="display:flex;gap:8px;align-items:center"><input type="checkbox" ${o.done?'checked':''} onchange="toggleOrder('${o.id}')" style="width:18px;height:18px"><div><b style="${o.done?'text-decoration:line-through;color:var(--muted)':''}">${o.name} ×${o.qty}</b><div style="font-size:11px;color:var(--muted)">${o.priority} • ${fmt(o.price)} = ${fmt(o.qty*o.price)}</div></div></div><div><button class="badge" onclick="delOrder('${o.id}')">🗑️</button></div></div>`).join('')||'<div style="text-align:center;color:var(--muted);padding:12px">لا يوجد طلبيات</div>'}</div>`;}
function renderReports(){const{ex,total,budget,remaining}=getMonthData(curMonth);const byCat={};ex.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.amount);const byDay={};ex.forEach(e=>{byDay[e.date]=(byDay[e.date]||0)+e.amount;});const months=Object.keys(db.budgets).concat([...new Set(db.expenses.map(e=>e.month))]).filter((v,i,a)=>a.indexOf(v)===i).sort().slice(-6);return `<div class="card"><b>📊 قديش صرفت هذا الشهر؟</b><div class="grid3" style="margin-top:10px"><div class="stat" style="background:var(--bg)"><span>الإجمالي</span><b>${fmt(total)}</b></div><div class="stat" style="background:var(--bg)"><span>عمليات</span><b>${ex.length}</b></div><div class="stat" style="background:var(--bg)"><span>الباقي</span><b>${fmt(remaining)}</b></div></div><canvas id="chart"></canvas><div style="margin-top:8px"><b style="font-size:13px">حسب الأقسام:</b>${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([catId,amt])=>{const c=db.cats.find(x=>x.id===catId);const p=total?Math.round(amt/total*100):0;return `<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${c?c.icon:''} ${c?c.name:catId}</span><span>${fmt(amt)} (${p}%)</span></div><div style="height:6px;background:var(--bg);border-radius:99px;overflow:hidden"><div style="width:${p}%;height:100%;background:var(--primary)"></div></div></div>`}).join('')||'<div style="color:var(--muted)">لا يوجد</div>'}</div></div><div class="card"><b>📅 حسب الأيام</b>${Object.entries(byDay).sort().map(([d,a])=>`<div class="row" style="justify-content:space-between;margin:6px 0"><span>${d}</span><b>${fmt(a)}</b></div>`).join('')||'<div style="color:var(--muted)">لا يوجد</div>'}</div><div class="card"><b>📈 مقارنة الأشهر</b>${months.map(m=>{const d=getMonthData(m);const p=d.budget?Math.round(d.total/d.budget*100):0;return `<div class="row" style="justify-content:space-between;margin:6px 0"><span>${monthLabel(m)}</span><span>${fmt(d.total)} / ${fmt(d.budget)} (${p}%)</span></div>`}).join('')}</div>`;}
function renderSettings(){const s=db.settings;return `<div class="card"><b>⚙️ الإعدادات</b><label>✏️ اسم التطبيق</label><input class="input" value="${s.appName}" oninput="db.settings.appName=this.value;save();applySettings()"><label>🌐 اللغة</label><div class="row"><button class="chip ${s.lang==='ar'?'active':''}" onclick="db.settings.lang='ar';save();applySettings();render()">عربي</button><button class="chip ${s.lang==='en'?'active':''}" onclick="db.settings.lang='en';save();applySettings();render()">English</button></div><label>💱 العملة</label><input class="input" value="${s.currency}" oninput="db.settings.currency=this.value;save();render()"><label>🌙 الوضع الليلي</label><div class="row"><button class="chip ${s.theme==='light'?'active':''}" onclick="db.settings.theme='light';save();applySettings();render()">☀️ نهاري</button><button class="chip ${s.theme==='dark'?'active':''}" onclick="db.settings.theme='dark';save();applySettings();render()">🌙 ليلي</button></div></div><div class="card"><b>📲 مشاركة التطبيق</b><div class="row" style="margin-top:8px"><button class="btn btn-ghost" style="flex:1" onclick="copyLink()">🔗 نسخ الرابط</button><button class="btn btn-ghost" style="flex:1" onclick="shareWhats()">💬 واتساب</button></div><button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="shareNative()">📤 مشاركة عامة</button></div><div class="card"><b>🌐 روابط التواصل</b><label>📘 فيسبوك</label><input class="input" value="${s.social.fb}" placeholder="https://facebook.com/..." oninput="db.settings.social.fb=this.value;save()"><label>📸 إنستغرام</label><input class="input" value="${s.social.insta}" placeholder="https://instagram.com/..." oninput="db.settings.social.insta=this.value;save()"><label>🎵 تيك توك</label><input class="input" value="${s.social.tiktok}" placeholder="https://tiktok.com/@..." oninput="db.settings.social.tiktok=this.value;save()"><label>🌐 رابط آخر</label><input class="input" value="${s.social.other}" placeholder="https://..." oninput="db.settings.social.other=this.value;save()"></div><div class="card"><b>💾 البيانات</b><div class="row" style="margin-top:8px"><button class="btn btn-ghost" style="flex:1" onclick="exportData()">📥 تصدير نسخة</button><label class="btn btn-ghost" style="flex:1;cursor:pointer">📤 استيراد<input type="file" hidden onchange="importData(event)"></label></div><button class="btn" style="width:100%;margin-top:8px;background:rgba(239,68,68,.1);color:#dc2626;border:1px solid rgba(239,68,68,.2)" onclick="clearData()">🗑️ حذف كل البيانات</button></div><div class="card"><b>📂 إدارة الأقسام</b><button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="openCat()">فتح إدارة الأقسام</button></div>`;}
function openAdd(){editId=null;selectedCat=db.cats[0].id;document.getElementById('f_date').value=new Date().toISOString().slice(0,10);document.getElementById('f_amount').value='';document.getElementById('f_desc').value='';document.getElementById('f_note').value='';renderCatPicker();document.getElementById('addModal').classList.add('open');}
function closeAdd(){document.getElementById('addModal').classList.remove('open');}
function renderCatPicker(){document.getElementById('catPicker').innerHTML=db.cats.map(c=>`<div class="cat ${selectedCat===c.id?'active':''}" onclick="selectedCat='${c.id}';renderCatPicker()">${c.icon} ${c.name}</div>`).join('');}
function saveExpense(){const amt=parseFloat(document.getElementById('f_amount').value);if(!amt)return alert('أدخل المبلغ');const desc=document.getElementById('f_desc').value||'بدون وصف';const date=document.getElementById('f_date').value||new Date().toISOString().slice(0,10);const note=document.getElementById('f_note').value;const month=date.slice(0,7);if(editId){const e=db.expenses.find(x=>x.id===editId);e.cat=selectedCat;e.amount=amt;e.desc=desc;e.date=date;e.note=note;e.month=month;}else db.expenses.push({id:Date.now()+'',month,cat:selectedCat,amount:amt,desc,date,note});save();closeAdd();render();}
function editExpense(id){const e=db.expenses.find(x=>x.id===id);editId=id;selectedCat=e.cat;document.getElementById('f_amount').value=e.amount;document.getElementById('f_desc').value=e.desc;document.getElementById('f_date').value=e.date;document.getElementById('f_note').value=e.note||'';renderCatPicker();document.getElementById('addModal').classList.add('open');}
function delExpense(id){if(confirm('حذف؟')){db.expenses=db.expenses.filter(x=>x.id!==id);save();render();}}
function editBudget(){const cur=db.budgets[curMonth]||0;const v=prompt('الميزانية الشهرية لـ '+monthLabel(curMonth),cur);if(v!==null){db.budgets[curMonth]=parseFloat(v)||0;save();render();}}
function openCat(){document.getElementById('catModal').classList.add('open');renderCatManage();}
function closeCat(){document.getElementById('catModal').classList.remove('open');}
function renderCatManage(){document.getElementById('catManageList').innerHTML=db.cats.map(c=>`<div class="listItem"><span>${c.icon} ${c.name}</span><button class="badge" onclick="removeCat('${c.id}')">🗑️</button></div>`).join('');}
function addNewCat(){const n=document.getElementById('newCatName').value.trim();const ic=document.getElementById('newCatIcon').value.trim()||'📦';if(!n)return;db.cats.push({id:Date.now()+'',name:n,icon:ic});save();document.getElementById('newCatName').value='';renderCatManage();render();}
function removeCat(id){if(confirm('حذف القسم؟')){db.cats=db.cats.filter(c=>c.id!==id);save();renderCatManage();render();}}
function openOrder(){document.getElementById('orderModal').classList.add('open');}
function closeOrder(){document.getElementById('orderModal').classList.remove('open');}
function setP(el){document.querySelectorAll('[data-p]').forEach(c=>c.classList.remove('active'));el.classList.add('active');selectedPriority=el.dataset.p;}
function saveOrder(){const name=document.getElementById('o_name').value.trim();if(!name)return alert('اسم المنتج');const qty=parseFloat(document.getElementById('o_qty').value)||1;const price=parseFloat(document.getElementById('o_price').value)||0;db.orders.push({id:Date.now()+'',month:curMonth,name,qty,price,priority:selectedPriority,done:false});save();closeOrder();render();}
function toggleOrder(id){const o=db.orders.find(x=>x.id===id);o.done=!o.done;save();render();}
function delOrder(id){if(confirm('حذف؟')){db.orders=db.orders.filter(x=>x.id!==id);save();render();}}
function copyLink(){navigator.clipboard.writeText(location.href);alert('تم نسخ الرابط');}
function shareWhats(){const t=`جرب تطبيق ${db.settings.appName}: ${location.href}`;window.open('https://wa.me/?text='+encodeURIComponent(t));}
function shareNative(){if(navigator.share)navigator.share({title:db.settings.appName,url:location.href});else copyLink();}
function exportData(){const blob=new Blob([JSON.stringify(db)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='masroof-backup.json';a.click();}
function importData(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();alert('تم الاستيراد');location.reload();}catch{alert('ملف غير صالح');}};r.readAsText(file);}
function clearData(){if(confirm('حذف كل البيانات؟')){localStorage.removeItem('masroof_v3');location.reload();}}
function drawChart(){const c=document.getElementById('chart');if(!c)return;const ctx=c.getContext('2d');const{ex,total}=getMonthData(curMonth);const byCat={};ex.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.amount);const entries=Object.entries(byCat);if(!entries.length)return;const colors=['#0f4c75','#3282b8','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899'];const W=c.width=c.clientWidth*2;const H=c.height=180*2;ctx.clearRect(0,0,W,H);let start=0;entries.forEach(([id,amt],i)=>{const ang=total?(amt/total)*Math.PI*2:0;ctx.beginPath();ctx.moveTo(W/2,H/2);ctx.fillStyle=colors[i%colors.length];ctx.arc(W/2,H/2,Math.min(W,H)/2-20,start,start+ang);ctx.closePath();ctx.fill();start+=ang;});}
init();
</script></body></html>
