<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مصروف البيت</title>
<style>
:root{--green:#10b981;--red:#ef4444;--blue:#2563eb;--bg:#f8fafc}
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma}
body{margin:0;background:var(--bg);padding-bottom:90px}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);position:sticky;top:0;z-index:10}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.bbox{border-radius:14px;padding:12px;text-align:center}
.bg-g{background:#ecfdf5}.bg-r{background:#fef2f2}.bg-b{background:#eff6ff}
.circle{width:88px;height:88px;border-radius:50%;border:8px solid #e5e7eb;border-top-color:var(--green);display:flex;flex-direction:column;align-items:center;justify-content:center}
.fab{width:52px;height:52px;border-radius:16px;background:#1e40af;color:#fff;border:none;font-size:28px;display:flex;align-items:center;justify-content:center}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;padding:8px 0}
.nav{border:none;background:none;color:#9ca3af;font-size:11px;display:flex;flex-direction:column;align-items:center}
.nav.active{color:#1e40af}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;align-items:flex-end}
.modal.show{display:flex}
.box{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:18px;max-height:85vh;overflow:auto}
input,select{width:100%;padding:13px;border:1px solid #e5e7eb;border-radius:12px;margin:7px 0;font-size:15px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:#1e40af;color:#fff;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="header">
<div style="font-weight:800;font-size:18px">🏠 مصروف البيت</div>
<div style="display:flex;gap:8px"><span style="border:1px solid #e5e7eb;border-radius:8px;padding:4px 8px;font-size:13px">September 2026 📅</span></div>
</div>

<div id="home">
<div class="card">
<div style="display:flex;justify-content:space-between;margin-bottom:12px"><b>الميزانية سبتمبر ٢٠٢٦</b><button style="border:1px solid #e5e7eb;border-radius:8px;padding:4px 10px;background:#fff;font-size:12px">✏️ تعديل</button></div>
<div class="grid3">
<div class="bbox bg-g"><div style="font-size:12px;color:#6b7280">الميزانية</div><div id="vB" style="font-weight:800;margin-top:4px">500.00 د.أ</div></div>
<div class="bbox bg-r"><div style="font-size:12px;color:#6b7280">مصروف</div><div id="vS" style="font-weight:800;margin-top:4px">0.00 د.أ</div></div>
<div class="bbox bg-b"><div style="font-size:12px;color:#6b7280">الباقي</div><div id="vR" style="font-weight:800;margin-top:4px">500.00 د.أ</div></div>
</div>
<div style="display:flex;gap:14px;align-items:center;margin-top:16px">
<div style="flex:1"><div style="font-size:13px;color:#6b7280">قديش صرفت؟</div><div id="vS2" style="font-weight:800">0.00 د.أ</div><div id="vC" style="font-size:12px;color:#9ca3af">0 عمليات</div></div>
<div class="circle"><div id="vP" style="font-weight:800">0%</div><div style="font-size:10px;color:#6b7280">من الميزانية</div></div>
</div>
</div>

<div class="card" style="display:flex;justify-content:space-between;align-items:center">
<div><div style="font-weight:700">🔥 أكثر الأقسام صرفاً</div><div style="font-size:12px;color:#9ca3af">لا يوجد</div></div>
<button class="fab" onclick="openAdd()">+</button>
</div>

<div class="card"><div style="font-weight:700;margin-bottom:10px">آخر العمليات</div><div id="last">لا يوجد مصاريف - اضغط +</div></div>
</div>

<div id="settings" style="display:none;padding:14px">
<h3>⚙️ الإعدادات</h3>
<div class="card">
<label style="font-weight:700">💱 العملة - كل عملات العالم (40 عملة)</label>
<select id="curSel"></select>
<p style="font-size:12px;color:#6b7280">اختار عملتك والكل بتغير تلقائي</p>
<button class="btn" style="margin-top:10px" onclick="saveSet()">حفظ الإعدادات</button>
</div>
</div>

<div class="modal" id="mAdd" onclick="if(event.target==this)closeAdd()">
<div class="box">
<h3>➕ إضافة مصروف</h3>
<input id="tTitle" placeholder="شو اشتريت؟">
<input id="tAmt" type="number" placeholder="المبلغ">
<select id="tCat"><option>🍔 أكل</option><option>🚗 مواصلات</option><option>🏠 بيت</option><option>🎮 ترفيه</option><option>🛒 تسوق</option><option>💊 صحة</option><option>أخرى</option></select>
<input id="tDate" type="date">
<button class="btn" onclick="saveExp()">حفظ</button>
<button style="width:100%;padding:12px;margin-top:8px;border:1px solid #e5e7eb;border-radius:12px;background:#fff" onclick="closeAdd()">إلغاء</button>
</div>
</div>

<div class="bottom">
<button class="nav active" id="nHome" onclick="showP('home')">🏠<span>الرئيسية</span></button>
<button class="nav">📋<span>السجل</span></button>
<button class="nav">🛒<span>الطلبات</span></button>
<button class="nav">📊<span>التقارير</span></button>
<button class="nav" id="nSet" onclick="showP('settings')">⚙️<span>الإعدادات</span></button>
</div>

<script>
const CURS=[
{code:'JOD',s:'د.أ',n:'دينار أردني - JOD',f:'🇯🇴'},
{code:'USD',s:'$',n:'دولار أمريكي - USD',f:'🇺🇸'},
{code:'EUR',s:'€',n:'يورو - EUR',f:'🇪🇺'},
{code:'GBP',s:'£',n:'جنيه إسترليني - GBP',f:'🇬🇧'},
{code:'SAR',s:'ر.س',n:'ريال سعودي - SAR',f:'🇸🇦'},
{code:'AED',s:'د.إ',n:'درهم إماراتي - AED',f:'🇦🇪'},
{code:'QAR',s:'ر.ق',n:'ريال قطري - QAR',f:'🇶🇦'},
{code:'KWD',s:'د.ك',n:'دينار كويتي - KWD',f:'🇰🇼'},
{code:'BHD',s:'د.ب',n:'دينار بحريني - BHD',f:'🇧🇭'},
{code:'OMR',s:'ر.ع',n:'ريال عماني - OMR',f:'🇴🇲'},
{code:'EGP',s:'ج.م',n:'جنيه مصري - EGP',f:'🇪🇬'},
{code:'LBP',s:'ل.ل',n:'ليرة لبنانية - LBP',f:'🇱🇧'},
{code:'SYP',s:'ل.س',n:'ليرة سورية - SYP',f:'🇸🇾'},
{code:'IQD',s:'ع.د',n:'دينار عراقي - IQD',f:'🇮🇶'},
{code:'YER',s:'ر.ي',n:'ريال يمني - YER',f:'🇾🇪'},
{code:'TRY',s:'₺',n:'ليرة تركية - TRY',f:'🇹🇷'},
{code:'MAD',s:'د.م',n:'درهم مغربي - MAD',f:'🇲🇦'},
{code:'DZD',s:'د.ج',n:'دينار جزائري - DZD',f:'🇩🇿'},
{code:'TND',s:'د.ت',n:'دينار تونسي - TND',f:'🇹🇳'},
{code:'LYD',s:'د.ل',n:'دينار ليبي - LYD',f:'🇱🇾'},
{code:'SDG',s:'ج.س',n:'جنيه سوداني - SDG',f:'🇸🇩'},
{code:'CAD',s:'C$',n:'دولار كندي - CAD',f:'🇨🇦'},
{code:'AUD',s:'A$',n:'دولار أسترالي - AUD',f:'🇦🇺'},
{code:'JPY',s:'¥',n:'ين ياباني - JPY',f:'🇯🇵'},
{code:'CNY',s:'¥',n:'يوان صيني - CNY',f:'🇨🇳'},
{code:'INR',s:'₹',n:'روبية هندية - INR',f:'🇮🇳'},
{code:'PKR',s:'₨',n:'روبية باكستانية - PKR',f:'🇵🇰'},
{code:'BRL',s:'R$',n:'ريال برازيلي - BRL',f:'🇧🇷'},
{code:'RUB',s:'₽',n:'روبل روسي - RUB',f:'🇷🇺'},
{code:'ZAR',s:'R',n:'راند جنوب أفريقي - ZAR',f:'🇿🇦'},
{code:'CHF',s:'Fr',n:'فرنك سويسري - CHF',f:'🇨🇭'},
{code:'SEK',s:'kr',n:'كرونة سويدية - SEK',f:'🇸🇪'},
{code:'NOK',s:'kr',n:'كرونة نرويجية - NOK',f:'🇳🇴'},
{code:'DKK',s:'kr',n:'كرونة دنماركية - DKK',f:'🇩🇰'},
{code:'SGD',s:'S$',n:'دولار سنغافوري - SGD',f:'🇸🇬'},
{code:'MYR',s:'RM',n:'رينغيت ماليزي - MYR',f:'🇲🇾'},
{code:'IDR',s:'Rp',n:'روبية إندونيسية - IDR',f:'🇮🇩'},
{code:'THB',s:'฿',n:'بات تايلاندي - THB',f:'🇹🇭'},
{code:'KRW',s:'₩',n:'وون كوري - KRW',f:'🇰🇷'},
{code:'NGN',s:'₦',n:'نايرا نيجيرية - NGN',f:'🇳🇬'}
];
let db=JSON.parse(localStorage.getItem('masroof_db')||'null')||{expenses:[],budget:500,settings:{currency:'JOD'}};
function cur(){return CURS.find(c=>c.code===db.settings.currency)||CURS[0]}
function init(){
let sel=document.getElementById('curSel');
CURS.forEach(c=>{
let o=document.createElement('option');o.value=c.code;o.textContent=c.f+' '+c.n+' ('+c.s+')';
if(c.code===db.settings.currency)o.selected=true;sel.appendChild(o);
});
document.getElementById('tDate').value=new Date().toISOString().slice(0,10);
render();
}
function render(){
let c=cur();let tot=db.expenses.reduce((s,e)=>s+e.amount,0);let rem=db.budget-tot;let pct=db.budget?Math.round(tot/db.budget*100):0;
document.getElementById('vB').textContent=db.budget.toFixed(2)+' '+c.s;
document.getElementById('vS').textContent=tot.toFixed(2)+' '+c.s;
document.getElementById('vS2').textContent=tot.toFixed(2)+' '+c.s;
document.getElementById('vR').textContent=rem.toFixed(2)+' '+c.s;
document.getElementById('vC').textContent=db.expenses.length+' عمليات';
document.getElementById('vP').textContent=pct+'%';
let l=document.getElementById('last');
if(!db.expenses.length)l.textContent='لا يوجد مصاريف بعد - اضغط +';
else l.innerHTML=db.expenses.slice(0,5).map(e=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f3f4f6"><span>${e.title}</span><span>${e.amount} ${c.s}</span></div>`).join('');
}
function showP(p){
document.getElementById('home').style.display=p==='home'?'block':'none';
document.getElementById('settings').style.display=p==='settings'?'block':'none';
document.getElementById('nHome').classList.toggle('active',p==='home');
document.getElementById('nSet').classList.toggle('active',p==='settings');
}
function openAdd(){document.getElementById('mAdd').classList.add('show')}
function closeAdd(){document.getElementById('mAdd').classList.remove('show')}
function saveExp(){
let t=document.getElementById('tTitle').value.trim();let a=parseFloat(document.getElementById('tAmt').value);
if(!t||!a)return alert('اكتب الاسم والمبلغ');
db.expenses.unshift({id:Date.now(),title:t,amount:a,date:document.getElementById('tDate').value});
localStorage.setItem('masroof_db',JSON.stringify(db));closeAdd();render();
document.getElementById('tTitle').value='';document.getElementById('tAmt').value='';
}
function saveSet(){
db.settings.currency=document.getElementById('curSel').value;
localStorage.setItem('masroof_db',JSON.stringify(db));
alert('تم حفظ العملة: '+db.settings.currency+' ✅');render();
}
init();
</script>
</body>
</html>
